[tools]
go = "1.27.0"
node = "24.21.0"
sqlc = "1.31.1"

[tasks.task-start]
description = "Start a task: fast-forward main, then create branch <type>/<slug> and its worktree from origin/main (usage: mise run task-start <type>/<slug>, type: feat fix docs refactor perf test ci chore)"
run = "scripts/task-start.sh"

[tasks.task-finish]
description = "Finish a merged task: remove its worktree and branches, then sync main (usage: mise run task-finish <type>/<slug> [--dry-run] [--volumes])"
run = "scripts/task-finish.sh"

[tasks.install]
description = "Install frontend dependencies"
run = "npm --prefix frontend ci"

[tasks.generate]
description = "Regenerate sqlc persistence code and frontend API types from backend/api/openapi.yaml"
run = [
  "sqlc -f backend/sqlc.yaml generate",
  "npm --prefix frontend run generate:api",
]

[tasks.check-api-types]
description = "Fail when frontend/src/api/schema.gen.ts differs from backend/api/openapi.yaml"
run = [
  "npm --prefix frontend run generate:api",
  "git diff --exit-code -- frontend/src/api/schema.gen.ts",
]

[tasks.check-sqlc]
description = "Fail when committed sqlc output differs from queries.sql and migrations"
run = "sqlc -f backend/sqlc.yaml diff"

[tasks.dev-frontend]
description = "Run the frontend development server"
run = "npm --prefix frontend run dev"

[tasks.dev-backend]
description = "Run the backend development server"
run = '''
AIHUB_DB_PORT="${POSTGRES_PORT:-55432}"
DATABASE_URL="${DATABASE_URL:-postgres://oh_my_aihub@127.0.0.1:${AIHUB_DB_PORT}/oh_my_aihub?sslmode=disable}" \
PGPASSWORD="${POSTGRES_PASSWORD:-oh-my-aihub-development}" \
go -C backend run ./cmd/server
'''
env = { COOKIE_SECURE = "false" }

[tasks.dev-database]
description = "Start PostgreSQL and apply pending migrations"
run = [
  "docker compose up -d database",
  "docker compose run --rm --build migration",
]

[tasks.test-backend-integration]
description = "Run PostgreSQL-backed backend integration tests"
run = [
  "docker compose up -d database",
  "docker compose run --rm --build migration",
  '''
AIHUB_DB_PORT="${POSTGRES_PORT:-55432}"
PGPASSWORD="${POSTGRES_PASSWORD:-oh-my-aihub-development}" \
TEST_DATABASE_URL="postgres://oh_my_aihub@127.0.0.1:${AIHUB_DB_PORT}/oh_my_aihub?sslmode=disable" \
go -C backend test -count=1 ./internal/postgres ./internal/database
''',
]

[tasks.test-ci-scripts]
description = "Test the CI change-scope classification and the gates aggregation (scripts/ci-changes.sh, scripts/ci-gate.sh)"
run = "scripts/test-ci.sh"

[tasks.check-migrations]
description = "Fail when a migration from the latest release tag was modified, deleted or renamed"
run = "scripts/check-migrations.sh"

[tasks.check-migration-upgrade]
description = "Migrate a fresh database with the latest release tag, then upgrade it with the current code"
run = [
  "docker compose up -d --wait database",
  '''
AIHUB_DB_PORT="${POSTGRES_PORT:-55432}"
PSQL="docker compose exec -T database psql -U oh_my_aihub" \
PGPASSWORD="${POSTGRES_PASSWORD:-oh-my-aihub-development}" \
TEST_DATABASE_URL="postgres://oh_my_aihub@127.0.0.1:${AIHUB_DB_PORT}/oh_my_aihub?sslmode=disable" \
scripts/check-migration-upgrade.sh
''',
]

[tasks.lint-backend]
description = "Run staticcheck on the backend (pinned; built with the project Go toolchain)"
run = "go -C backend run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./..."

[tasks.lint]
description = "Run the frontend lint (oxlint) and backend staticcheck"
run = [
  "npm --prefix frontend run lint",
  { task = "lint-backend" },
]

[tasks.test]
description = "Run frontend and backend tests and build checks"
run = [
  "npm --prefix frontend test",
  "npm --prefix frontend run build",
  "go -C backend test ./...",
]

[tasks.check-release]
description = "Run every gate required for a release candidate"
run = [
  "npm --prefix frontend ci --prefer-offline --no-audit --no-fund --fetch-timeout=60000",
  "npm --prefix frontend run lint",
  "npm --prefix frontend test",
  "npm --prefix frontend run build",
  "go -C backend vet ./...",
  { task = "lint-backend" },
  "go -C backend test -race ./...",
  "docker compose config --quiet",
]

[tasks.build]
description = "Build frontend and backend"
run = [
  "npm --prefix frontend run build",
  "mkdir -p backend/bin",
  "go -C backend build -o bin/server ./cmd/server",
]

[tasks.up]
description = "Build and start the secure Docker stack"
run = '''
: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required for the secure stack}"
: "${TRUSTED_PROXY_CIDR:?TRUSTED_PROXY_CIDR must match the TLS proxy source as seen by the frontend container}"
: "${BACKEND_TRUSTED_PROXY_CIDRS:?BACKEND_TRUSTED_PROXY_CIDRS must match the Compose network used by the frontend proxy}"
: "${UPSTREAM_CREDENTIAL_KEYRING:?UPSTREAM_CREDENTIAL_KEYRING must contain the versioned upstream credential encryption keys}"
: "${UPSTREAM_CREDENTIAL_ACTIVE_KEY_ID:?UPSTREAM_CREDENTIAL_ACTIVE_KEY_ID is required}"
: "${C2C_PRIVATE_DATA_KEYRING:?C2C_PRIVATE_DATA_KEYRING must contain the versioned C2C private data encryption keys}"
: "${C2C_PRIVATE_DATA_ACTIVE_KEY_ID:?C2C_PRIVATE_DATA_ACTIVE_KEY_ID is required}"
docker compose up --build
'''

[tasks.up-dev]
description = "Build and start the Docker stack for local HTTP development"
run = '''
: "${UPSTREAM_CREDENTIAL_KEYRING:?UPSTREAM_CREDENTIAL_KEYRING must contain the versioned upstream credential encryption keys}"
: "${UPSTREAM_CREDENTIAL_ACTIVE_KEY_ID:?UPSTREAM_CREDENTIAL_ACTIVE_KEY_ID is required}"
: "${C2C_PRIVATE_DATA_KEYRING:?C2C_PRIVATE_DATA_KEYRING must contain the versioned C2C private data encryption keys}"
: "${C2C_PRIVATE_DATA_ACTIVE_KEY_ID:?C2C_PRIVATE_DATA_ACTIVE_KEY_ID is required}"
docker compose up --build
'''
env = { COOKIE_SECURE = "false", TRUSTED_PROXY_CIDR = "127.0.0.1/32" }

[tasks.check-proxy-trust]
description = "Verify the running stack trusts the configured host TLS proxy source"
run = '''
AIHUB_SMOKE_BODY="$(mktemp)"
trap 'rm -f "$AIHUB_SMOKE_BODY"' EXIT
AIHUB_FRONTEND_PORT="${FRONTEND_PORT:-3000}"
AIHUB_SMOKE_STATUS="$(curl --silent --show-error \
  --output "$AIHUB_SMOKE_BODY" \
  --write-out '%{http_code}' \
  --request POST \
  --header 'Host: proxy-smoke.invalid' \
  --header 'Origin: https://proxy-smoke.invalid' \
  --header 'X-Forwarded-Proto: https' \
  --header 'X-Forwarded-For: 198.51.100.10' \
  --header 'Content-Type: application/json' \
  --data '{"username":"proxy-smoke","password":"proxy-smoke-password"}' \
  "http://127.0.0.1:${AIHUB_FRONTEND_PORT}/api/auth/login")"
if [ "$AIHUB_SMOKE_STATUS" != "401" ] || ! grep -q '"invalid_credentials"' "$AIHUB_SMOKE_BODY"; then
  echo "proxy trust check failed with HTTP $AIHUB_SMOKE_STATUS" >&2
  cat "$AIHUB_SMOKE_BODY" >&2
  exit 1
fi
echo "proxy trust check passed"
'''

[tasks.down]
description = "Stop the Docker stack"
run = "docker compose down"
