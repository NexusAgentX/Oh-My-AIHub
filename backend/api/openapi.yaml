# Oh-My-AIHub OpenAPI 契约（ADR-0021）。手工维护；修改后运行 mise run generate 重新生成前端类型。
openapi: 3.1.0
info:
  title: Oh-My-AIHub API
  version: 0.7.0-dev
  description: "Oh-My-AIHub 前后端契约的唯一来源（ADR-0021）。覆盖全部 /api/** JSON 接口；/v1/**、/v1beta/** 外部模型 API 入口只登记路径与认证。\n\n约定：积分金额为十进制字符串（最多 9 位小数）；人民币为整数分（*_fen）；费率为整数纳比率（*_rate_nano，1e9 = 100%）；时间为 RFC 3339；字段统一 snake_case；错误统一为 {\"error\": \"<code>\", \"message\": \"<中文>\", \"request_id\"?: \"...\"}；列表统一游标分页（cursor / limit → items / next_cursor）；除 GET/HEAD/OPTIONS 外的 /api 请求须携带与 Host 同源的 Origin。\n\n扩展字段：x-access 声明路由门禁（public 无需会话；session 需会话，允许首次改密前访问；ready 需会话且已完成首次改密；admin 在 ready 基础上需管理员；gateway_key 凭平台 API Key）；x-feature 标明负责实现的 Feature（Epic #170），尚未实现的接口返回 501 not_implemented。契约测试逐项对照路由表、门禁与实现状态。"
servers:
- {url: /, description: 同源部署：开发环境由 Vite 代理，Compose 环境由 Nginx 代理。}
tags:
- {name: instance, description: 实例与健康检查}
- {name: auth, description: 认证与当前账户}
- {name: home, description: 首页}
- {name: models, description: 模型与路由}
- {name: keys, description: API Key}
- {name: channels, description: 渠道}
- {name: calls, description: 调用与用量}
- {name: points, description: 积分}
- {name: c2c, description: C2C 卖单市场}
- {name: admin-accounts, description: 管理员：账户}
- {name: admin-models, description: 管理员：模型目录}
- {name: admin-settings, description: 管理员：设置与操作记录}
- {name: admin-channels, description: 管理员：渠道治理}
- {name: admin-c2c, description: 管理员：C2C 仲裁}
- {name: admin-observe, description: 管理员：观测}
- {name: gateway, description: 外部模型 API 入口}
paths:
  /api/health:
    get:
      operationId: getHealth
      tags: [instance]
      summary: 健康检查
      x-access: public
      x-feature: A
      security: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/instance:
    get:
      operationId: getInstance
      tags: [instance]
      summary: 实例是否已初始化
      x-access: public
      x-feature: A
      security: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InstanceState'}
  /api/instance/initialize:
    post:
      operationId: initializeInstance
      tags: [instance]
      summary: 初始化实例并创建首个管理员
      description: 仅在实例尚无管理员时可用；成功后建立会话并设置会话 Cookie。
      x-access: public
      x-feature: A
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InstanceInitializeRequest'}
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountEnvelope'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /api/auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: 登录
      description: 成功时设置会话 Cookie。用户名或密码错误、账户停用均返回 401 invalid_credentials。
      x-access: public
      x-feature: A
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountEnvelope'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /api/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: 退出登录
      x-access: public
      x-feature: A
      security: []
      responses:
        '204': {description: 成功，无响应体。}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: 当前账户
      description: 允许仍须首次改密的账户访问。
      x-access: session
      x-feature: A
      security:
      - {sessionCookie: []}
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountEnvelope'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/me/password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: 修改密码
      description: 成功后撤销全部旧会话并签发新会话 Cookie；首次登录改密也使用本接口。
      x-access: session
      x-feature: A
      security:
      - {sessionCookie: []}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChangePasswordRequest'}
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountEnvelope'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /api/home:
    get:
      operationId: getHome
      tags: [home]
      summary: 首页
      x-access: ready
      x-feature: B
      security:
      - {sessionCookie: []}
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HomeResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/models:
    get:
      operationId: listModels
      tags: [models]
      summary: 可用模型列表
      x-access: ready
      x-feature: B
      security:
      - {sessionCookie: []}
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CatalogModelList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/models/{modelID}:
    get:
      operationId: getModel
      tags: [models]
      summary: 模型详情、渠道与我的路由
      x-access: ready
      x-feature: B
      security:
      - {sessionCookie: []}
      parameters:
      - {$ref: '#/components/parameters/modelID'}
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ModelDetail'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/routing/{modelID}:
    put:
      operationId: setRouting
      tags: [models]
      summary: 设置账号级路由
      description: "对该用户所有未单独设置路由的 Key 生效。"
      x-access: ready
      x-feature: B
      security:
      - {sessionCookie: []}
      parameters:
      - {$ref: '#/components/parameters/modelID'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RoutingPreferenceInput'}
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RoutingPreference'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /api/keys:
    get:
      operationId: listKeys
      tags: [keys]
      summary: 我的 API Key
      x-access: ready
      x-feature: B
      security:
      - {sessionCookie: []}
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiKeyList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: createKey
      tags: [keys]
      summary: 创建 API Key
      description: "每个用户最多 20 把未删除的 Key（超过返回 409 key_limit_reached）。"
      x-access: ready
      x-feature: B
      security:
      - {sessionCookie: []}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ApiKeyCreateRequest'}
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiKeyCreated'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /api/keys/{keyID}:
    get:
      operationId: getKey
      tags: [keys]
      summary: API Key 详情
      x-access: ready
      x-feature: B
      security:
      - {sessionCookie: []}
      parameters:
      - {$ref: '#/components/parameters/keyID'}
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiKeyDetail'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      operationId: updateKey
      tags: [keys]
      summary: 修改 API Key
      x-access: ready
      x-feature: B
      security:
      - {sessionCookie: []}
      parameters:
      - {$ref: '#/components/parameters/keyID'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ApiKeyUpdateRequest'}
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiKeyEnvelope'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}
    delete:
      operationId: deleteKey
      tags: [keys]
      summary: 删除 API Key
      x-access: ready
      x-feature: B
      security:
      - {sessionCookie: []}
      parameters:
      - {$ref: '#/components/parameters/keyID'}
      responses:
        '204': {description: 成功，无响应体。}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/keys/{keyID}/secret:
    get:
      operationId: getKeySecret
      tags: [keys]
      summary: 复制完整 Key
      description: "每次读取写入审计（查看 API Key 明文）。"
      x-access: ready
      x-feature: B
      security:
      - {sessionCookie: []}
      parameters:
      - {$ref: '#/components/parameters/keyID'}
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiKeySecret'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/keys/{keyID}/routing/{modelID}:
    put:
      operationId: setKeyRouting
      tags: [keys]
      summary: 设置该 Key 的单独路由
      x-access: ready
      x-feature: B
      security:
      - {sessionCookie: []}
      parameters:
      - {$ref: '#/components/parameters/keyID'}
      - {$ref: '#/components/parameters/modelID'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RoutingPreferenceInput'}
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RoutingPreference'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}
    delete:
      operationId: deleteKeyRouting
      tags: [keys]
      summary: 删除该 Key 的单独路由
      x-access: ready
      x-feature: B
      security:
      - {sessionCookie: []}
      parameters:
      - {$ref: '#/components/parameters/keyID'}
      - {$ref: '#/components/parameters/modelID'}
      responses:
        '204': {description: 成功，无响应体。}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/channels:
    get:
      operationId: listChannels
      tags: [channels]
      summary: 我的渠道
      x-access: ready
      x-feature: B
      security:
      - {sessionCookie: []}
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChannelList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: createChannel
      tags: [channels]
      summary: 添加渠道
      x-access: ready
      x-feature: B
      security:
      - {sessionCookie: []}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChannelCreateRequest'}
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChannelEnvelope'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /api/channels/discover:
    post:
      operationId: discoverChannel
      tags: [channels]
      summary: 读取上游模型列表并匹配目录
      description: "Base URL 经出站安全校验（HTTPS、DNS/IP、端口白名单、禁用主机）。"
      x-access: ready
      x-feature: B
      security:
      - {sessionCookie: []}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChannelDiscoverRequest'}
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChannelDiscoverResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '502': {$ref: '#/components/responses/BadGateway'}
  /api/channels/{channelID}:
    get:
      operationId: getChannel
      tags: [channels]
      summary: 渠道详情
      x-access: ready
      x-feature: B
      security:
      - {sessionCookie: []}
      parameters:
      - {$ref: '#/components/parameters/channelID'}
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChannelDetail'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      operationId: updateChannel
      tags: [channels]
      summary: 修改渠道
      description: "被管理员强制下架的渠道不能由所有者重新上架（409）。"
      x-access: ready
      x-feature: B
      security:
      - {sessionCookie: []}
      parameters:
      - {$ref: '#/components/parameters/channelID'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChannelUpdateRequest'}
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChannelEnvelope'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
    delete:
      operationId: deleteChannel
      tags: [channels]
      summary: 删除渠道
      x-access: ready
      x-feature: B
      security:
      - {sessionCookie: []}
      parameters:
      - {$ref: '#/components/parameters/channelID'}
      responses:
        '204': {description: 成功，无响应体。}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/channels/{channelID}/test:
    post:
      operationId: testChannel
      tags: [channels]
      summary: 按模型逐个格式测试
      description: "会向上游发出真实请求，可能产生少量费用。"
      x-access: ready
      x-feature: B
      security:
      - {sessionCookie: []}
      parameters:
      - {$ref: '#/components/parameters/channelID'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChannelTestRequest'}
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChannelTestResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /api/calls:
    get:
      operationId: listCalls
      tags: [calls]
      summary: 我的调用记录
      description: 我的调用记录，响应同时返回当前筛选下的汇总（请求数、成功率、首字 p50/p95、tokens、费用）。筛选均为 AND；cursor 为 created_at 与 id 的键集游标。
      x-access: ready
      x-feature: G
      security:
      - {sessionCookie: []}
      parameters:
      - {$ref: '#/components/parameters/requestID'}
      - {$ref: '#/components/parameters/minDurationMs'}
      - {$ref: '#/components/parameters/maxDurationMs'}
      - {$ref: '#/components/parameters/minTokens'}
      - {$ref: '#/components/parameters/maxTokens'}
      - {$ref: '#/components/parameters/minCost'}
      - {$ref: '#/components/parameters/maxCost'}
      - {$ref: '#/components/parameters/channelIDQuery'}
      - {$ref: '#/components/parameters/modelQuery'}
      - {$ref: '#/components/parameters/outcome'}
      - {$ref: '#/components/parameters/apiKeyIDQuery'}
      - {$ref: '#/components/parameters/tag'}
      - {$ref: '#/components/parameters/format'}
      - {$ref: '#/components/parameters/from'}
      - {$ref: '#/components/parameters/to'}
      - {$ref: '#/components/parameters/cursor'}
      - {$ref: '#/components/parameters/limit'}
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CallPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/calls/stream:
    get:
      operationId: streamCalls
      tags: [calls]
      summary: 我的调用实时流
      description: 订阅进程内事件总线：调用开始与结束各推送一次摘要。事件名 call.started / call.finished；每 15 秒一行注释心跳；慢消费者的事件被丢弃，断线由前端重连。
      x-access: ready
      x-feature: G
      security:
      - {sessionCookie: []}
      parameters:
      - {$ref: '#/components/parameters/modelQuery'}
      - {$ref: '#/components/parameters/apiKeyIDQuery'}
      - {$ref: '#/components/parameters/channelIDQuery'}
      - {$ref: '#/components/parameters/outcome'}
      responses:
        '200':
          description: Server-Sent Events 流；每个 event 的 data 为一条 JSON（CallSummary）。
          content:
            text/event-stream:
              schema: {type: string}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/calls/{callID}:
    get:
      operationId: getCall
      tags: [calls]
      summary: 调用详情
      description: 调用详情：全部字段、尝试时间线、价格快照与关联账本交易。调用者、该调用最终渠道或尝试渠道的所有者（只看到自己渠道的尝试，不含 Key 名、标签与调用者信息）、管理员可见。
      x-access: ready
      x-feature: G
      security:
      - {sessionCookie: []}
      parameters:
      - {$ref: '#/components/parameters/callID'}
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CallDetailEnvelope'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/usage:
    get:
      operationId: getUsage
