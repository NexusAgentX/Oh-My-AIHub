        default_cooldown_seconds: {type: integer, minimum: 10, maximum: 86400}
        account_max_inflight_calls: {type: integer, minimum: 0, maximum: 1000, description: 每个账号同时在途的网关调用数上限，超过时以 429 拒绝；0 表示不限，默认 20。}
        extra_blocked_hosts:
          type: array
