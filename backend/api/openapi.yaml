        duration_milliseconds: {type: integer}
        started_at: {$ref: "#/components/schemas/Timestamp"}
        completed_at:
          anyOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
      required: [id, validation_version, attempt_seq, status, error_category, http_status, duration_milliseconds, started_at, completed_at]
      additionalProperties: false
    ValidationAttempt:
      type: object
      description: "含上游原始错误，仅渠道所有者与管理员可见。"
      properties:
        id: {type: string}
        validation_version: {type: integer}
        attempt_seq: {type: integer}
        status: {type: string, enum: [in_progress, passed, failed]}
        error_category: {type: string, description: "auth_failure、upstream_error、transport_error、timeout、response_too_large、invalid_response、configuration_error 或空串。"}
        http_status: {type: [integer, "null"]}
        duration_milliseconds: {type: integer}
        started_at: {$ref: "#/components/schemas/Timestamp"}
        completed_at:
          anyOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        actor_account_id: {type: string}
        raw_error: {type: string}
        raw_error_truncated: {type: boolean}
      required: [id, validation_version, attempt_seq, status, error_category, http_status, duration_milliseconds, started_at, completed_at, actor_account_id, raw_error, raw_error_truncated]
      additionalProperties: false
    ValidationAttemptEnvelope:
      type: object
      properties:
        validation: {$ref: "#/components/schemas/ValidationAttempt"}
      required: [validation]
      additionalProperties: false
    ValidationAttemptList:
      type: object
      properties:
        validation_attempts:
          type: array
          items: {$ref: "#/components/schemas/ValidationAttempt"}
      required: [validation_attempts]
      additionalProperties: false
    OwnerOffer:
      type: object
      properties:
        id: {type: string}
        model_id: {type: string}
