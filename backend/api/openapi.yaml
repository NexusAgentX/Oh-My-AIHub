components:
  securitySchemes:
    sessionCookie: {type: apiKey, in: cookie, name: oma_session, description: 登录后由服务端设置的 HttpOnly 会话 Cookie。}
    bearerKey: {type: http, scheme: bearer, description: '平台 API Key：Authorization: Bearer <key>（OpenAI 格式）。'}
    anthropicKey: {type: apiKey, in: header, name: x-api-key, description: 平台 API Key（Anthropic 格式）。}
    geminiKey: {type: apiKey, in: header, name: x-goog-api-key, description: 平台 API Key（Gemini 格式）。}
    geminiQueryKey: {type: apiKey, in: query, name: key, description: 平台 API Key（Gemini 查询参数形式）。}
  parameters:
    accountID:
      name: accountID
      in: path
      required: true
      description: 账户 ID。
      schema: {type: string, format: uuid}
    modelID:
      name: modelID
      in: path
      required: true
      description: 模型名。
      schema: {type: string}
    keyID:
      name: keyID
      in: path
      required: true
      description: API Key ID。
      schema: {type: string, format: uuid}
    channelID:
      name: channelID
      in: path
      required: true
      description: 渠道 ID。
      schema: {type: string, format: uuid}
    callID:
      name: callID
      in: path
      required: true
      description: 调用（请求）ID。
      schema: {type: string, format: uuid}
    orderID:
      name: orderID
      in: path
      required: true
      description: C2C 卖单 ID。
      schema: {type: string, format: uuid}
    tradeID:
      name: tradeID
      in: path
      required: true
      description: C2C 交易 ID。
      schema: {type: string, format: uuid}
    transactionID:
      name: transactionID
      in: path
      required: true
      description: 账本交易 ID。
      schema: {type: string, format: uuid}
    model:
      name: model
      in: path
      required: true
      description: 模型名与动作，例如 `gemini-2.5-flash:generateContent`。
      schema: {type: string}
    cursor:
      name: cursor
      in: query
      required: false
      description: 上一页返回的 next_cursor。
      schema: {type: string}
    limit:
      name: limit
      in: query
      required: false
      description: 每页条数，1～100，默认 20。
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    from:
      name: from
      in: query
      required: false
      description: 开始时间（含）。
      schema: {type: string, format: date-time}
    to:
      name: to
      in: query
      required: false
      description: 结束时间（不含）。
      schema: {type: string, format: date-time}
    q:
      name: q
      in: query
      required: false
      description: 搜索关键字。
      schema: {type: string}
    modelQuery:
      name: model
      in: query
      required: false
      description: 模型名。
      schema: {type: string}
    outcome:
      name: outcome
      in: query
      required: false
      description: 结果分类。
      schema: {$ref: '#/components/schemas/CallOutcome'}
    apiKeyIDQuery:
      name: api_key_id
      in: query
      required: false
      description: API Key ID。
      schema: {type: string, format: uuid}
    accountIDQuery:
      name: account_id
      in: query
      required: false
      description: 账户 ID。
      schema: {type: string, format: uuid}
    channelIDQuery:
      name: channel_id
      in: query
      required: false
      description: 渠道 ID。
      schema: {type: string, format: uuid}
    tag:
      name: tag
      in: query
      required: false
      description: 调用标签（X-AIHub-Tag）。
      schema: {type: string}
    format:
      name: format
      in: query
      required: false
      description: API 格式。
      schema: {$ref: '#/components/schemas/Format'}
    groupBy:
      name: group_by
      in: query
      required: false
      description: 聚合维度；channel 仅在 view=revenue 时有效。
      schema: {type: string, enum: [day, model, key, tag, channel], default: day}
    transactionType:
      name: type
      in: query
      required: false
      description: 交易类型。
      schema: {$ref: '#/components/schemas/TransactionType'}
    exportFormat:
      name: format
      in: query
      required: false
      description: json（默认）或 csv。
      schema: {type: string, enum: [json, csv], default: json}
    accountStatus:
      name: status
      in: query
      required: false
      description: 账户状态。
      schema: {$ref: '#/components/schemas/AccountStatus'}
    channelStatus:
      name: status
      in: query
      required: false
      description: 渠道状态。
      schema: {$ref: '#/components/schemas/ChannelStatus'}
    ownerID:
      name: owner_id
      in: query
      required: false
      description: 所有者账户 ID。
      schema: {type: string, format: uuid}
    tradeRole:
      name: role
      in: query
      required: false
      description: 我的角色。
      schema: {type: string, enum: [buyer, seller]}
    tradeStatus:
      name: status
      in: query
      required: false
      description: 交易状态。
      schema: {$ref: '#/components/schemas/TradeStatus'}
    orderStatus:
      name: status
      in: query
      required: false
      description: 卖单状态。
      schema: {$ref: '#/components/schemas/OrderStatus'}
    tradePending:
      name: pending
      in: query
      required: false
      description: 为 true 时只返回待我处理的交易：我是买家且待付款，或我是卖家且已付款待放行。
      schema: {type: boolean}
    auditAction:
      name: action
      in: query
      required: false
      description: 操作类型，例如 account.created。
      schema: {type: string}
    targetType:
      name: target_type
      in: query
      required: false
      description: 对象类型，例如 account、model。
      schema: {type: string}
    targetID:
      name: target_id
      in: query
      required: false
      description: 对象 ID。
      schema: {type: string}
    actorID:
      name: actor_id
      in: query
      required: false
      description: 操作者账户 ID。
      schema: {type: string, format: uuid}
    requestID:
      name: request_id
      in: query
      required: false
      description: 请求 ID，精确匹配。
      schema: {type: string, format: uuid}
    minDurationMs:
      name: min_duration_ms
      in: query
      required: false
      description: 总耗时下限（毫秒，含）。
      schema: {type: integer, minimum: 0}
    maxDurationMs:
      name: max_duration_ms
      in: query
      required: false
      description: 总耗时上限（毫秒，含）。
      schema: {type: integer, minimum: 0}
    minTokens:
      name: min_tokens
      in: query
      required: false
      description: 总 tokens（输入 + 输出 + 缓存读写）下限（含）。
      schema: {type: integer, minimum: 0}
    maxTokens:
      name: max_tokens
      in: query
      required: false
      description: 总 tokens 上限（含）。
      schema: {type: integer, minimum: 0}
    minCost:
      name: min_cost
      in: query
      required: false
      description: 实际扣除（费用 + 手续费）下限（含）。
      schema: {$ref: '#/components/schemas/Amount'}
    maxCost:
      name: max_cost
      in: query
      required: false
      description: 实际扣除（费用 + 手续费）上限（含）。
      schema: {$ref: '#/components/schemas/Amount'}
    usageView:
      name: view
      in: query
      required: false
      description: spend 为我的消费（默认）；revenue 为我的渠道收入。
      schema: {type: string, enum: [spend, revenue], default: spend}
    pointsGroup:
      name: group
      in: query
      required: false
      description: 汇总方式：day 或 key；省略则不返回 summary。
      schema: {type: string, enum: [day, key]}
    trendDays:
      name: days
      in: query
      required: false
      description: 走势时间窗（天），7、30 或 90。
      schema: {type: integer, enum: [7, 30, 90], default: 30}
    relatedType:
      name: related_type
      in: query
      required: false
      description: 关联对象类型，需与 related_id 同时给出。
      schema: {type: string, enum: [call, c2c_order, c2c_trade, account]}
    relatedID:
      name: related_id
      in: query
      required: false
      description: 关联对象 ID。
      schema: {type: string, format: uuid}
    Idempotency-Key:
      name: Idempotency-Key
      in: header
      required: false
      description: 幂等键；相同键重复提交返回同一结果，不重复记账。
      schema: {type: string, maxLength: 128}
  responses:
    BadRequest:
      description: 请求格式无效或参数非法（invalid_json、invalid_request、invalid_cursor）。
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Unauthorized:
      description: 未登录或会话失效（authentication_required）。
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Forbidden:
      description: 被拒绝：跨站请求（cross_origin_request）、首次登录须改密（password_change_required）、需要管理员（administrator_required）或无权操作（forbidden）。
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    NotFound:
      description: 资源不存在（not_found）。
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Conflict:
      description: 状态冲突（conflict、already_initialized、last_administrator、idempotency_conflict 等）。
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Unprocessable:
      description: 业务校验失败（invalid_input、nothing_to_write_off、cannot_modify_self、unsafe_upstream 等）。
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    TooManyRequests:
      description: 触发限流或服务繁忙（login_rate_limited、password_rate_limited、*_busy）。
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Unavailable:
      description: 服务暂不可用（database_unavailable）。
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    BadGateway:
      description: 上游不可达或返回错误（upstream_error）。
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    NotImplemented:
      description: 接口已在契约中定义但尚未实现（not_implemented）。
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
  schemas:
    Amount: {type: string, pattern: '^-?[0-9]+(\.[0-9]{1,9})?$', description: 积分金额的十进制字符串，最多 9 位小数，不使用浮点数，例如 "12.5"。}
    NullableAmount: {type: [string, 'null'], pattern: '^-?[0-9]+(\.[0-9]{1,9})?$', description: 可空的积分金额十进制字符串。}
    Price: {type: string, pattern: '^(0|[1-9][0-9]{0,5})(\.[0-9]{1,9})?$', description: 单价（积分/百万 token）的十进制字符串，0～100000，最多 9 位小数。}
    Multiplier: {type: string, pattern: '^(0|[1-9][0-9]{0,3})(\.[0-9]{1,9})?$', description: 渠道倍率的十进制字符串，0～1000，最多 9 位小数，默认 "1"。}
    Ratio: {type: string, pattern: '^(0|1)(\.[0-9]{1,6})?$', description: 0～1 之间的比率十进制字符串（如成功率）。}
    Timestamp: {type: string, format: date-time, description: RFC 3339 时间。}
    NullableTimestamp: {type: [string, 'null'], format: date-time, description: 可空的 RFC 3339 时间。}
    Date: {type: string, format: date, description: 日期（YYYY-MM-DD，Asia/Shanghai）。}
    Format:
      type: string
      enum: [openai_chat, openai_responses, anthropic, gemini]
      description: 原生 API 格式：OpenAI Chat、OpenAI Responses、Anthropic Messages、Gemini。网关不做格式转换。
    RoutingMode: {type: string, enum: [cheapest, reliable, fastest, manual], description: 调用方式：便宜优先（默认）、稳定优先、快速优先、手动排序。}
    CallOutcome:
      type: string
      enum: [rejected_balance, rejected_budget, rejected_key, rejected_model, rejected_format, rejected_no_channel, upstream_failed, interrupted, client_disconnected, succeeded, succeeded_unbilled, in_progress]
      description: 调用结果分类。succeeded_unbilled 为成功但读不到用量（不收费）；interrupted 为已开始输出后中断。
    AccountStatus: {type: string, enum: [active, disabled]}
    ChannelStatus: {type: string, enum: [listed, unlisted, suspended], description: 上架、下架（所有者）、强制下架（管理员）。}
    TransactionType: {type: string, enum: [api_call, c2c_list, c2c_release, c2c_return, admin_adjust, bad_debt_writeoff]}
    OrderStatus: {type: string, enum: [open, closed, filled]}
    TradeStatus: {type: string, enum: [awaiting_payment, paid, released, cancelled, disputed, resolved_to_buyer, resolved_to_seller]}
    ErrorResponse:
      type: object
      description: 所有 /api 错误的统一结构。
      properties:
        error: {type: string, description: 稳定的机器可读错误码，例如 not_found、not_implemented。}
        message: {type: string, description: 可读中文提示。}
        request_id: {type: string, description: 相关调用的请求 ID（仅网关与调用相关错误）。}
      required: [error, message]
      additionalProperties: false
    Health:
      type: object
      properties:
        service: {type: string, const: oh-my-aihub-backend}
        status: {type: string, const: ok}
      required: [service, status]
      additionalProperties: false
    InstanceState:
      type: object
      properties:
        initialized: {type: boolean}
      required: [initialized]
      additionalProperties: false
    InstanceInitializeRequest:
      type: object
      properties:
        username: {type: string}
        display_name: {type: string}
        password: {type: string}
      required: [username, display_name, password]
      additionalProperties: false
    LoginRequest:
      type: object
      properties:
        username: {type: string, maxLength: 128}
        password: {type: string, maxLength: 128}
      required: [username, password]
      additionalProperties: false
    ChangePasswordRequest:
      type: object
      properties:
        current_password: {type: string, maxLength: 128}
        new_password: {type: string, maxLength: 128}
      required: [current_password, new_password]
      additionalProperties: false
    Account:
      type: object
      description: 当前登录账户。余额与额度见 GET /api/points。
      properties:
        id: {type: string, format: uuid}
        username: {type: string}
        display_name: {type: string}
        is_admin: {type: boolean}
        status: {$ref: '#/components/schemas/AccountStatus'}
        must_change_password: {type: boolean}
        created_at: {$ref: '#/components/schemas/Timestamp'}
      required: [id, username, display_name, is_admin, status, must_change_password, created_at]
      additionalProperties: false
    AccountEnvelope:
      type: object
      properties:
        account: {$ref: '#/components/schemas/Account'}
      required: [account]
      additionalProperties: false
    Party:
      type: object
      description: 对其他用户可见的最小账户信息。
      properties:
        id: {type: string, format: uuid}
        display_name: {type: string}
      required: [id, display_name]
      additionalProperties: false
    AccountRef:
      type: object
      description: 管理员视图中的账户引用。
      properties:
        id: {type: string, format: uuid}
        username: {type: string}
        display_name: {type: string}
      required: [id, username, display_name]
      additionalProperties: false
    KeyRef:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
      required: [id, name]
      additionalProperties: false
    TierRef:
      type: object
      properties:
        seq: {type: integer, minimum: 1, maximum: 16}
        name: {type: string}
      required: [seq, name]
      additionalProperties: false
    ModelPrices:
      type: object
      description: 通用及可选细分单价，积分/百万 token。细分未配置时继承对应通用桶价格，零表示免费。
      properties:
        input: {$ref: '#/components/schemas/Price'}
        output: {$ref: '#/components/schemas/Price'}
        token_prices:
          description: 可选键 cache_write_5m、cache_write_1h，以及 input/output/cache_read 与 text/image/audio/video 的下划线组合；缺失继承本组通用价，零表示免费。
          type: object
          additionalProperties: {$ref: '#/components/schemas/Price'}
        cache_write: {$ref: '#/components/schemas/Price'}
        cache_read: {$ref: '#/components/schemas/Price'}
      required: [input, output, cache_write, cache_read]
      additionalProperties: false
    EffectivePrices:
      type: object
      description: 乘以渠道倍率后的四个现价，积分/百万 token。
      properties:
        input: {$ref: '#/components/schemas/Amount'}
        output: {$ref: '#/components/schemas/Amount'}
        cache_write: {$ref: '#/components/schemas/Amount'}
        cache_read: {$ref: '#/components/schemas/Amount'}
      required: [input, output, cache_write, cache_read]
      additionalProperties: false
    Usage:
      type: object
      properties:
        input_tokens: {type: integer}
        output_tokens: {type: integer}
        cache_write_tokens: {type: integer}
        cache_read_tokens: {type: integer}
      required: [input_tokens, output_tokens, cache_write_tokens, cache_read_tokens]
      additionalProperties: false
    PointsSummary:
      type: object
      description: available = balance + credit_limit，即还能透支消费的额度，超限后为负。
      properties:
        balance: {$ref: '#/components/schemas/Amount'}
        credit_limit: {$ref: '#/components/schemas/Amount'}
        available: {$ref: '#/components/schemas/Amount'}
      required: [balance, credit_limit, available]
      additionalProperties: false
    PointsTrendPoint:
      type: object
      properties:
        date: {$ref: '#/components/schemas/Date'}
        balance: {$ref: '#/components/schemas/Amount'}
        income: {$ref: '#/components/schemas/Amount'}
        spend: {$ref: '#/components/schemas/Amount'}
      required: [date, balance, income, spend]
      additionalProperties: false
    PointsPeriod:
      type: object
      description: 期间对账（默认本月）：期初 + 调用支出 + 渠道收入 + C2C 买入 + C2C 卖出（挂单转入托管）+ 退回 + 调账 + 核销 = 期末，difference 为期末减去等式左侧，正常为 "0"。income 与 spend 为全部正向与负向变动的合计（spend 以正数表示）。自己的渠道调用不产生账本交易，故不计入。
      properties:
        from: {$ref: '#/components/schemas/Timestamp'}
        to: {$ref: '#/components/schemas/Timestamp'}
        opening_balance: {$ref: '#/components/schemas/Amount'}
        closing_balance: {$ref: '#/components/schemas/Amount'}
        income: {$ref: '#/components/schemas/Amount'}
        spend: {$ref: '#/components/schemas/Amount'}
        call_spend: {$ref: '#/components/schemas/Amount', description: 调用支出（≤ 0，含手续费）。}
        channel_income: {$ref: '#/components/schemas/Amount', description: 渠道收入（≥ 0）。}
        c2c_buy: {$ref: '#/components/schemas/Amount', description: C2C 买入：卖家放行或仲裁判给买家到账（≥ 0）。}
        c2c_sell: {$ref: '#/components/schemas/Amount', description: C2C 卖出：挂单转入托管（≤ 0）。}
        c2c_return: {$ref: '#/components/schemas/Amount', description: 挂单关闭、取消或仲裁退回（≥ 0）。}
        adjustments: {$ref: '#/components/schemas/Amount', description: 管理员调账（带符号）。}
        write_offs: {$ref: '#/components/schemas/Amount', description: 坏账核销补平的金额（≥ 0）。}
        difference: {$ref: '#/components/schemas/Amount'}
      required: [from, to, opening_balance, closing_balance, income, spend, call_spend, channel_income, c2c_buy, c2c_sell, c2c_return, adjustments, write_offs, difference]
      additionalProperties: false
    Points:
      type: object
      description: 积分概况；trend 为最近 30 天每日走势，period 为指定期间对账。
      properties:
        balance: {$ref: '#/components/schemas/Amount'}
        credit_limit: {$ref: '#/components/schemas/Amount'}
        available: {$ref: '#/components/schemas/Amount'}
        updated_at: {$ref: '#/components/schemas/Timestamp'}
        trend:
          type: array
          items: {$ref: '#/components/schemas/PointsTrendPoint'}
          description: 最近 30 天（Asia/Shanghai 自然日）每日期末余额、收入与支出。
        period: {$ref: '#/components/schemas/PointsPeriod'}
      required: [balance, credit_limit, available, updated_at]
      additionalProperties: false
    LedgerRelated:
      type: object
      properties:
        type: {type: string, enum: [call, c2c_order, c2c_trade, account]}
        id: {type: string, format: uuid}
      required: [type, id]
      additionalProperties: false
    PointsEntry:
      type: object
      properties:
        id: {type: string, description: 分录 ID，亦为分页游标。}
        transaction_id: {type: string, format: uuid}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        type: {$ref: '#/components/schemas/TransactionType'}
        reason: {type: string}
        related:
          anyOf:
          - {$ref: '#/components/schemas/LedgerRelated'}
          - {type: 'null'}
        amount: {$ref: '#/components/schemas/Amount'}
        balance_after: {$ref: '#/components/schemas/Amount'}
        api_key:
          anyOf:
          - {$ref: '#/components/schemas/KeyRef'}
          - {type: 'null'}
      required: [id, transaction_id, created_at, type, reason, related, amount, balance_after, api_key]
      additionalProperties: false
    PointsEntrySummary:
      type: object
      description: 按天与按 Key 汇总；仅返回 group 参数指定的那一种，另一种为空数组。按 Key 汇总只含调用支出（api_call 的负向分录）；调用没有 Key 归属时 api_key 为 null。
      properties:
        by_day:
          type: array
          items:
            type: object
            properties:
              date: {$ref: '#/components/schemas/Date'}
              income: {$ref: '#/components/schemas/Amount'}
              spend: {$ref: '#/components/schemas/Amount'}
              net: {$ref: '#/components/schemas/Amount'}
            required: [date, income, spend, net]
            additionalProperties: false
        by_key:
          type: array
          items:
            type: object
            properties:
              api_key:
                anyOf:
                - {$ref: '#/components/schemas/KeyRef'}
                - {type: 'null'}
              spend: {$ref: '#/components/schemas/Amount'}
              entries: {type: integer}
            required: [api_key, spend, entries]
            additionalProperties: false
      required: [by_day, by_key]
      additionalProperties: false
    PointsEntryPage:
      type: object
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/PointsEntry'}
        next_cursor: {type: [string, 'null'], description: 下一页游标；为 null 表示没有更多。}
        summary: {$ref: '#/components/schemas/PointsEntrySummary'}
      required: [items, next_cursor]
      additionalProperties: false
    DefaultKey:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        prefix: {type: string}
      required: [id, name, prefix]
      additionalProperties: false
    HomeResponse:
      type: object
      properties:
        points: {$ref: '#/components/schemas/PointsSummary'}
        today:
          type: object
          properties:
            spend: {$ref: '#/components/schemas/Amount'}
            calls: {type: integer}
            succeeded_calls: {type: integer}
          required: [spend, calls, succeeded_calls]
          additionalProperties: false
        channels:
          type: object
          properties:
            today_revenue: {$ref: '#/components/schemas/Amount'}
            online: {type: integer}
            total: {type: integer}
          required: [today_revenue, online, total]
          additionalProperties: false
        default_key:
          anyOf:
          - {$ref: '#/components/schemas/DefaultKey'}
          - {type: 'null'}
        pending_c2c_trades: {type: integer, description: 待我处理（付款或放行）的 C2C 交易数。}
        recent_calls:
          type: array
          items: {$ref: '#/components/schemas/CallSummary'}
          maxItems: 5
      required: [points, today, channels, default_key, pending_c2c_trades, recent_calls]
      additionalProperties: false
    PriceTier:
      type: object
      description: 条件价格档（ADR-0012）：按 seq 首个命中，整单生效。
      properties:
        seq: {type: integer, minimum: 1, maximum: 16}
        service_tier: {type: string, maxLength: 64, description: '实际响应档位，含协议前缀，如 openai:default 或 anthropic:priority。'}
        thinking_mode: {type: string, enum: ['', qwen_thinking, qwen_non_thinking]}
        name: {type: string, maxLength: 64}
