      required: [account_kind, account_id, business_role, amount]
      additionalProperties: false
    LedgerEntry:
      type: object
      properties:
        id: {type: string, description: "账本分录 ID 的十进制字符串，可作为 before 游标。"}
        transaction_id: {type: string}
        entry_ordinal: {type: integer}
        business_role: {type: string}
        amount: {$ref: "#/components/schemas/Amount"}
        posted_balance_before: {$ref: "#/components/schemas/Amount"}
        posted_balance_after: {$ref: "#/components/schemas/Amount"}
        created_at: {$ref: "#/components/schemas/Timestamp"}
        transaction_kind: {type: string, enum: [transfer, admin_adjustment, bad_debt_transfer, hold_capture, self_channel_usage, reversal]}
        reason: {type: string}
        reference_type: {type: string}
        reference_id: {type: string}
        actor_account_id: {type: string}
        reversal_of_transaction_id: {type: string}
        hold_id: {type: string}
        counterparties:
          type: array
          items: {$ref: "#/components/schemas/LedgerCounterparty"}
      required: [id, transaction_id, entry_ordinal, business_role, amount, posted_balance_before, posted_balance_after, created_at, transaction_kind, reason, reference_type, reference_id, actor_account_id, reversal_of_transaction_id, hold_id, counterparties]
      additionalProperties: false
    LedgerTransactionEntry:
      type: object
      properties:
        id: {type: string, description: "账本分录 ID 的十进制字符串，可作为 before 游标。"}
        transaction_id: {type: string}
        entry_ordinal: {type: integer}
        business_role: {type: string}
        amount: {$ref: "#/components/schemas/Amount"}
        posted_balance_before: {$ref: "#/components/schemas/Amount"}
        posted_balance_after: {$ref: "#/components/schemas/Amount"}
        created_at: {$ref: "#/components/schemas/Timestamp"}
        transaction_kind: {type: string, enum: [transfer, admin_adjustment, bad_debt_transfer, hold_capture, self_channel_usage, reversal]}
        reason: {type: string}
        reference_type: {type: string}
        reference_id: {type: string}
        actor_account_id: {type: string}
        reversal_of_transaction_id: {type: string}
        hold_id: {type: string}
        counterparties:
          type: array
          items: {$ref: "#/components/schemas/LedgerCounterparty"}
        account_id: {type: string}
        account_kind: {type: string, enum: [user, platform_incentive, platform_loss]}
      required: [id, transaction_id, entry_ordinal, business_role, amount, posted_balance_before, posted_balance_after, created_at, transaction_kind, reason, reference_type, reference_id, actor_account_id, reversal_of_transaction_id, hold_id, counterparties, account_id, account_kind]
      additionalProperties: false
    LedgerEntryPage:
      type: object
      properties:
        entries:
          type: array
          items: {$ref: "#/components/schemas/LedgerEntry"}
        next_before: {type: string, description: "下一页游标；已无更多时为空字符串。"}
      required: [entries, next_before]
      additionalProperties: false
    LedgerTransaction:
      type: object
      properties:
        id: {type: string}
        idempotency_key: {type: string}
        kind: {type: string}
        reason: {type: string}
        reference_type: {type: string}
        reference_id: {type: string}
        actor_account_id: {type: string}
        reversal_of_transaction_id: {type: string}
        hold_id: {type: string}
        entries:
          type: array
          items: {$ref: "#/components/schemas/LedgerTransactionEntry"}
        created_at: {$ref: "#/components/schemas/Timestamp"}
      required: [id, idempotency_key, kind, reason, reference_type, reference_id, actor_account_id, reversal_of_transaction_id, hold_id, entries, created_at]
      additionalProperties: false
    LedgerTransactionEnvelope:
      type: object
      properties:
        transaction: {$ref: "#/components/schemas/LedgerTransaction"}
      required: [transaction]
      additionalProperties: false
    LedgerAccountRef:
      type: object
      description: "account_id 与 system_kind 二选一。"
      properties:
        account_id: {type: string, format: uuid}
        system_kind: {type: string, enum: [platform_incentive, platform_loss]}
      required: []
      additionalProperties: false
    LedgerAdjustmentRequest:
      type: object
      properties:
        from: {$ref: "#/components/schemas/LedgerAccountRef"}
        to: {$ref: "#/components/schemas/LedgerAccountRef"}
        amount: {$ref: "#/components/schemas/Amount"}
        reason: {type: string}
        reference_type: {type: string}
