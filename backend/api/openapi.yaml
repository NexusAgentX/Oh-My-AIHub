        spend_authorization_difference: {$ref: "#/components/schemas/Amount"}
        hold_projection_mismatch_accounts: {type: integer}
        zero_sum: {type: boolean}
        ledger_consistent: {type: boolean}
        total_credit_limit: {$ref: "#/components/schemas/Amount"}
        credit_capacity_used: {$ref: "#/components/schemas/Amount"}
        asset_reserved: {$ref: "#/components/schemas/Amount"}
        spend_authorized: {$ref: "#/components/schemas/Amount"}
