    Amount: {type: string, pattern: '^-?[0-9]+(\.[0-9]{1,9})?$', description: 积分金额的十进制字符串，最多 9 位小数，不使用浮点数，例如 "12.5"。}
    NullableAmount: {type: [string, 'null'], pattern: '^-?[0-9]+(\.[0-9]{1,9})?$', description: 可空的积分金额十进制字符串。}
    Price: {type: string, pattern: '^(0|[1-9][0-9]{0,5})(\.[0-9]{1,9})?$', description: 单价（积分/百万 token）的十进制字符串，0～100000，最多 9 位小数。}
    Multiplier: {type: string, pattern: '^(0|[1-9][0-9]{0,3})(\.[0-9]{1,9})?$', description: 渠道倍率的十进制字符串，0～1000，最多 9 位小数，默认 "1"。}
    PriceCurrency: {type: string, enum: [CNY, USD], description: 模型基准价的币种。CNY 的基准价即积分价（1 积分 ≈ 1 元）；USD 的基准价为美元，展示与计费时乘以平台美元汇率换算为积分。}
    ExchangeRate: {type: string, pattern: '^(0|[1-9][0-9]{0,2})(\.[0-9]{1,9})?$', description: 1 美元兑人民币的十进制字符串，0.01～100，最多 9 位小数。}
    EffectiveMultiplier: {type: string, pattern: '^(0|[1-9][0-9]*)(\.[0-9]{1,9})?$', description: 实际倍率：渠道对模型积分价实际乘上的倍率。开启汇率优惠的美元模型为「倍率 ÷ 汇率」，其余等于倍率。}
    Ratio: {type: string, pattern: '^(0|1)(\.[0-9]{1,6})?$', description: 0～1 之间的比率十进制字符串（如成功率）。}
    Timestamp: {type: string, format: date-time, description: RFC 3339 时间。}
    NullableTimestamp: {type: [string, 'null'], format: date-time, description: 可空的 RFC 3339 时间。}
    Date: {type: string, format: date, description: 日期（YYYY-MM-DD，Asia/Shanghai）。}
    Format:
      type: string
      enum: [openai_chat, openai_responses, anthropic, gemini, openai_images]
      description: 原生 API 格式：OpenAI Chat、OpenAI Responses、Anthropic Messages、Gemini、Images。网关不做格式转换。
    RoutingMode: {type: string, enum: [cheapest, reliable, fastest, manual], description: 调用方式：便宜优先（默认）、稳定优先、快速优先、手动排序。}
    CallOutcome:
      type: string
      enum: [rejected_balance, rejected_budget, rejected_key, rejected_model, rejected_format, rejected_no_channel, rejected_inflight, upstream_failed, interrupted, client_disconnected, succeeded, succeeded_unbilled, in_progress]
      description: 调用结果分类。succeeded_unbilled 为成功但读不到用量（不收费）；interrupted 为已开始输出后中断。
    AccountStatus: {type: string, enum: [active, disabled]}
    ChannelStatus: {type: string, enum: [listed, unlisted, suspended], description: 上架、下架（所有者）、强制下架（管理员）。}
    TransactionType: {type: string, enum: [api_call, c2c_list, c2c_release, c2c_return, admin_adjust, bad_debt_writeoff]}
    OrderStatus: {type: string, enum: [open, closed, filled]}
    TradeStatus: {type: string, enum: [awaiting_payment, paid, released, cancelled, disputed, resolved_to_buyer, resolved_to_seller]}
    ErrorResponse:
      type: object
      description: 所有 /api 错误的统一结构。
      properties:
        error: {type: string, description: 稳定的机器可读错误码，例如 not_found、not_implemented。}
        message: {type: string, description: 可读中文提示。}
        request_id: {type: string, description: 相关调用的请求 ID（仅网关与调用相关错误）。}
      required: [error, message]
      additionalProperties: false
    Health:
      type: object
