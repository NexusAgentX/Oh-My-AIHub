      required: [account, transaction_id, replayed]
      additionalProperties: false
    Settings:
      type: object
      properties:
        fee_rate_nano: {type: integer, minimum: 0, maximum: 1000000000, description: 手续费率，1e9 = 100%，默认 1000000 = 0.1%。}
        c2c_payment_timeout_minutes: {type: integer, minimum: 5, maximum: 1440}
        default_credit_limit: {$ref: '#/components/schemas/Amount'}
        default_max_attempts: {type: integer, minimum: 1, maximum: 10}
        default_ttft_timeout_ms: {type: integer, minimum: 1000, maximum: 600000}
        default_total_timeout_ms: {type: integer, minimum: 1000, maximum: 3600000}
        default_cooldown_failures: {type: integer, minimum: 1, maximum: 100}
        default_cooldown_seconds: {type: integer, minimum: 10, maximum: 86400}
        extra_blocked_hosts:
          type: array
          items: {type: string}
          maxItems: 100
          description: 叠加在 UPSTREAM_BLOCKED_HOSTS 之上的出站禁用主机。
        updated_at: {$ref: '#/components/schemas/Timestamp'}
      required: [fee_rate_nano, c2c_payment_timeout_minutes, default_credit_limit, default_max_attempts, default_ttft_timeout_ms, default_total_timeout_ms, default_cooldown_failures, default_cooldown_seconds, extra_blocked_hosts, updated_at]
      additionalProperties: false
    SettingsUpdateRequest:
      type: object
      description: 整体替换全部设置。
      properties:
        fee_rate_nano: {type: integer, minimum: 0, maximum: 1000000000, description: 手续费率，1e9 = 100%，默认 1000000 = 0.1%。}
        c2c_payment_timeout_minutes: {type: integer, minimum: 5, maximum: 1440}
        default_credit_limit: {$ref: '#/components/schemas/Amount'}
        default_max_attempts: {type: integer, minimum: 1, maximum: 10}
        default_ttft_timeout_ms: {type: integer, minimum: 1000, maximum: 600000}
        default_total_timeout_ms: {type: integer, minimum: 1000, maximum: 3600000}
        default_cooldown_failures: {type: integer, minimum: 1, maximum: 100}
        default_cooldown_seconds: {type: integer, minimum: 10, maximum: 86400}
        extra_blocked_hosts:
          type: array
          items: {type: string}
          maxItems: 100
          description: 叠加在 UPSTREAM_BLOCKED_HOSTS 之上的出站禁用主机。
      required: [fee_rate_nano, c2c_payment_timeout_minutes, default_credit_limit, default_max_attempts, default_ttft_timeout_ms, default_total_timeout_ms, default_cooldown_failures, default_cooldown_seconds, extra_blocked_hosts]
      additionalProperties: false
    SettingsEnvelope:
      type: object
      properties:
        settings: {$ref: '#/components/schemas/Settings'}
      required: [settings]
      additionalProperties: false
    AuditEntry:
      type: object
      properties:
        id: {type: string}
        actor:
          anyOf:
          - {$ref: '#/components/schemas/AccountRef'}
          - {type: 'null'}
        action: {type: string}
        target_type: {type: string}
        target_id: {type: string}
        reason: {type: string}
        detail: {type: object, description: 操作详情（例如修改前后值）。}
        created_at: {$ref: '#/components/schemas/Timestamp'}
      required: [id, actor, action, target_type, target_id, reason, detail, created_at]
      additionalProperties: false
    AuditPage:
      type: object
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/AuditEntry'}
        next_cursor: {type: [string, 'null'], description: 下一页游标；为 null 表示没有更多。}
      required: [items, next_cursor]
      additionalProperties: false
    AdminChannel:
      type: object
      description: 管理员视角的渠道；上游 Key 不回显。
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        base_url: {type: string}
        status: {$ref: '#/components/schemas/ChannelStatus'}
        suspended_reason: {type: [string, 'null']}
        cooldown_until: {$ref: '#/components/schemas/NullableTimestamp'}
        models:
          type: array
          items: {$ref: '#/components/schemas/ChannelModel'}
        advanced: {$ref: '#/components/schemas/ChannelAdvanced'}
        today: {$ref: '#/components/schemas/ChannelToday'}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        updated_at: {$ref: '#/components/schemas/Timestamp'}
        owner: {$ref: '#/components/schemas/AccountRef'}
      required: [id, name, base_url, status, suspended_reason, cooldown_until, models, advanced, today, created_at, updated_at, owner]
      additionalProperties: false
    AdminChannelPage:
      type: object
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/AdminChannel'}
        next_cursor: {type: [string, 'null'], description: 下一页游标；为 null 表示没有更多。}
      required: [items, next_cursor]
      additionalProperties: false
    AdminChannelEnvelope:
      type: object
      properties:
        channel: {$ref: '#/components/schemas/AdminChannel'}
      required: [channel]
      additionalProperties: false
    AdminChannelDetail:
      type: object
      properties:
        channel: {$ref: '#/components/schemas/AdminChannel'}
        events:
          type: array
          items: {$ref: '#/components/schemas/ChannelEvent'}
      required: [channel, events]
      additionalProperties: false
    ReasonRequest:
      type: object
      properties:
        reason: {type: string, minLength: 1, maxLength: 500}
      required: [reason]
      additionalProperties: false
    LedgerCheck:
      type: object
      description: 实时现算的零和核对；total 正常为 "0"。
      properties:
        balanced: {type: boolean}
        total: {$ref: '#/components/schemas/Amount'}
        checked_at: {$ref: '#/components/schemas/Timestamp'}
      required: [balanced, total, checked_at]
      additionalProperties: false
    AttentionItem:
      type: object
      properties:
        kind:
          type: string
          enum: [dispute, over_limit, negative_balance, credit_concentration, channel_suspended, channel_failing, unbilled_usage, ledger_unbalanced, reconciliation_failed, stuck_call]
          description: dispute 申诉中的交易；over_limit 超出信用额度的账户；negative_balance 负余额超过 30 天；credit_concentration 单个用户持有超过 50% 流通积分；channel_failing 渠道 1 小时成功率低于 80% 且调用不少于 20 次；unbilled_usage 24 小时内读不到用量的成功调用占比超过 5% 或超过 20 次；ledger_unbalanced 账户合计不为 0；reconciliation_failed 记账失败或其余核对不通过；channel_suspended 与 stuck_call 暂不产生。
        severity: {type: string, enum: [warning, critical]}
        title: {type: string}
        count: {type: integer, description: 该项涉及的条目数（账户、渠道、交易、调用或未通过的核对项的数量），每个渠道异常算 1 条。}
        link: {type: string}
      required: [kind, severity, title, count, link]
      additionalProperties: false
    AdminOverview:
      type: object
      properties:
        attention:
          type: array
          items: {$ref: '#/components/schemas/AttentionItem'}
        ledger: {$ref: '#/components/schemas/LedgerCheck'}
        today:
          type: object
          properties:
            calls: {type: integer}
            succeeded: {type: integer}
            success_rate:
              anyOf:
              - {$ref: '#/components/schemas/Ratio'}
              - {type: 'null'}
            spend: {$ref: '#/components/schemas/Amount'}
            fee_revenue: {$ref: '#/components/schemas/Amount'}
          required: [calls, succeeded, success_rate, spend, fee_revenue]
          additionalProperties: false
        c2c:
          type: object
          properties:
            open_orders: {type: integer}
            awaiting_payment: {type: integer}
            open_disputes: {type: integer}
            trades_24h: {type: integer, description: 最近 24 小时成交（放行或判给买家）笔数。}
            volume_24h: {$ref: '#/components/schemas/Amount', description: 最近 24 小时成交积分数量。}
            avg_price_fen_24h: {type: [number, 'null'], description: 最近 24 小时成交均价（分/积分，按数量加权）；无成交为 null。}
          required: [open_orders, awaiting_payment, open_disputes, trades_24h, volume_24h, avg_price_fen_24h]
          additionalProperties: false
        credit:
          type: object
          description: 信用占用。
          properties:
            issued: {$ref: '#/components/schemas/Amount', description: 信用发行：全部用户负余额合计的绝对值（已占用的信用）。}
            limit: {$ref: '#/components/schemas/Amount', description: 总信用额度：全部用户信用额度合计。}
          required: [issued, limit]
          additionalProperties: false
        last_24h:
          type: object
          description: 最近 24 小时调用（含被拒绝的调用）。
          properties:
            calls: {type: integer}
            succeeded: {type: integer}
            success_rate:
              anyOf:
              - {$ref: '#/components/schemas/Ratio'}
              - {type: 'null'}
          required: [calls, succeeded, success_rate]
          additionalProperties: false
      required: [attention, ledger, today, c2c, credit, last_24h]
      additionalProperties: false
    AdminPointsBalances:
      type: object
      description: user_positive + user_negative + c2c_escrow + platform_revenue + bad_debt = total，正常为 "0"。user_positive（流通积分）为用户正余额合计；user_negative 为用户负余额合计（≤ 0）；credit_issued（信用发行）为 user_negative 的绝对值，即已占用的信用；c2c_escrow 为 C2C 托管账户余额；platform_revenue 为平台收入；bad_debt 为已核销坏账。
      properties:
        user_positive: {$ref: '#/components/schemas/Amount'}
        user_negative: {$ref: '#/components/schemas/Amount'}
        credit_issued: {$ref: '#/components/schemas/Amount'}
        c2c_escrow: {$ref: '#/components/schemas/Amount'}
        platform_revenue: {$ref: '#/components/schemas/Amount'}
        bad_debt: {$ref: '#/components/schemas/Amount'}
        total: {$ref: '#/components/schemas/Amount'}
        total_credit_limit: {$ref: '#/components/schemas/Amount', description: 总信用额度：全部用户信用额度合计。}
        bad_debt_writeoffs: {type: integer, description: 已核销坏账笔数。}
        escrow_orders: {type: integer, description: 托管中的卖单数（available 或 in_trade 大于 0）。}
        escrow_trades_in_progress: {type: integer, description: 托管中进行中的交易笔数（待付款、已付款、申诉中）。}
      required: [user_positive, user_negative, credit_issued, c2c_escrow, platform_revenue, bad_debt, total, total_credit_limit, bad_debt_writeoffs, escrow_orders, escrow_trades_in_progress]
      additionalProperties: false
    AdminPointsRisk:
      type: object
      properties:
        account: {$ref: '#/components/schemas/AccountRef'}
        balance: {$ref: '#/components/schemas/Amount'}
        credit_limit: {$ref: '#/components/schemas/Amount'}
        available: {$ref: '#/components/schemas/Amount'}
        kind: {type: string, enum: [over_limit, negative_long], description: over_limit 余额低于 −信用额度；negative_long 负余额已持续超过 30 天。}
        negative_days: {type: [integer, 'null'], description: 负余额持续天数：从最近一次由非负变为负算起；当前非负为 null。}
        last_activity_at: {$ref: '#/components/schemas/NullableTimestamp'}
      required: [account, balance, credit_limit, available, kind, negative_days, last_activity_at]
      additionalProperties: false
    AdminPoints:
      type: object
      properties:
        balances: {$ref: '#/components/schemas/AdminPointsBalances'}
        check: {$ref: '#/components/schemas/LedgerCheck', description: 核对①：全部账户余额合计为 0。}
        trend:
          type: array
          items:
            type: object
            properties:
              date: {$ref: '#/components/schemas/Date'}
              circulation: {$ref: '#/components/schemas/Amount', description: 当日期末流通积分（用户正余额合计）。}
              credit_issued: {$ref: '#/components/schemas/Amount', description: 当日期末信用发行（用户负余额合计的绝对值）。}
              platform_revenue: {$ref: '#/components/schemas/Amount'}
              bad_debt: {$ref: '#/components/schemas/Amount'}
              c2c_escrow: {$ref: '#/components/schemas/Amount'}
              api_volume: {$ref: '#/components/schemas/Amount', description: 当日 API 结算量（调用费用 + 手续费）。}
              api_fee: {$ref: '#/components/schemas/Amount', description: 当日 API 手续费收入。}
              c2c_volume: {$ref: '#/components/schemas/Amount', description: 当日 C2C 成交积分数量（放行或判给买家）。}
              c2c_avg_price_fen: {type: [number, 'null'], description: 当日 C2C 成交均价（分/积分，按数量加权）；无成交为 null。}
            required: [date, circulation, credit_issued, platform_revenue, bad_debt, c2c_escrow, api_volume, api_fee, c2c_volume, c2c_avg_price_fen]
            additionalProperties: false
        risks:
          type: array
          items: {$ref: '#/components/schemas/AdminPointsRisk'}
        concentration:
          type: object
          description: 持有集中度：前 5 名用户持有的积分占流通积分的比例。
          properties:
            top5_share:
              anyOf:
              - {$ref: '#/components/schemas/Ratio'}
              - {type: 'null'}
            top:
              type: array
              items:
                type: object
                properties:
                  account: {$ref: '#/components/schemas/AccountRef'}
                  balance: {$ref: '#/components/schemas/Amount'}
                  share: {$ref: '#/components/schemas/Ratio'}
                required: [account, balance, share]
                additionalProperties: false
          required: [top5_share, top]
          additionalProperties: false
        checks: {$ref: '#/components/schemas/LedgerChecks'}
      required: [balances, check, trend, risks, concentration, checks]
      additionalProperties: false
    LedgerChecks:
      type: object
      description: 五项实时核对中除①（零和，见 check）外的四项，每次请求现算，不存历史。自己的渠道调用不产生账本交易，漏记核对已排除。
      properties:
        checked_at: {$ref: '#/components/schemas/Timestamp'}
        all_passed: {type: boolean, description: 五项（含 check）全部通过。}
        account_balances:
          type: object
          description: ②每个账户 balance 等于其分录合计。
          properties:
            passed: {type: boolean}
            mismatches:
              type: array
              items:
                type: object
                properties:
                  ledger_account: {$ref: '#/components/schemas/LedgerAccountRef'}
                  balance: {$ref: '#/components/schemas/Amount'}
                  entries_total: {$ref: '#/components/schemas/Amount'}
                required: [ledger_account, balance, entries_total]
                additionalProperties: false
          required: [passed, mismatches]
          additionalProperties: false
        escrow:
          type: object
          description: ③c2c_escrow 余额等于全部卖单 available + in_trade 之和。
          properties:
            passed: {type: boolean}
            escrow_balance: {$ref: '#/components/schemas/Amount'}
            orders_total: {$ref: '#/components/schemas/Amount'}
            difference: {$ref: '#/components/schemas/Amount'}
          required: [passed, escrow_balance, orders_total, difference]
          additionalProperties: false
        billing_calls:
          type: object
          description: ④每次应计费的成功调用都有 ledger_tx_id（succeeded、interrupted、client_disconnected 且费用大于 0，排除渠道所有者即调用者的调用）。missing 最多列出 100 条。
          properties:
            passed: {type: boolean}
            missing_count: {type: integer}
            missing:
              type: array
              items:
                type: object
                properties:
                  call_id: {type: string, format: uuid}
                  created_at: {$ref: '#/components/schemas/Timestamp'}
                  account: {$ref: '#/components/schemas/AccountRef'}
                  channel: {$ref: '#/components/schemas/ChannelRef'}
                  outcome: {$ref: '#/components/schemas/CallOutcome'}
                  charged: {$ref: '#/components/schemas/Amount'}
                required: [call_id, created_at, account, channel, outcome, charged]
                additionalProperties: false
          required: [passed, missing_count, missing]
          additionalProperties: false
        released_trades:
          type: object
          description: ⑤每笔 released 与 resolved_to_buyer 的 C2C 交易都有账本记账。missing 最多列出 100 条。
          properties:
            passed: {type: boolean}
            missing_count: {type: integer}
            missing:
              type: array
              items:
                type: object
                properties:
                  trade_id: {type: string, format: uuid}
                  status: {$ref: '#/components/schemas/TradeStatus'}
                  amount: {$ref: '#/components/schemas/Amount'}
                  resolved_at: {$ref: '#/components/schemas/NullableTimestamp'}
                required: [trade_id, status, amount, resolved_at]
                additionalProperties: false
          required: [passed, missing_count, missing]
          additionalProperties: false
      required: [checked_at, all_passed, account_balances, escrow, billing_calls, released_trades]
      additionalProperties: false
    LedgerAccountRef:
      type: object
      properties:
        kind: {type: string, enum: [user, system]}
        account:
          anyOf:
          - {$ref: '#/components/schemas/AccountRef'}
          - {type: 'null'}
        system_code: {type: [string, 'null'], enum: [platform_revenue, c2c_escrow, bad_debt, null]}
      required: [kind, account, system_code]
      additionalProperties: false
    LedgerTransactionEntry:
      type: object
      properties:
        ledger_account: {$ref: '#/components/schemas/LedgerAccountRef'}
        amount: {$ref: '#/components/schemas/Amount'}
        balance_before: {$ref: '#/components/schemas/Amount'}
        balance_after: {$ref: '#/components/schemas/Amount'}
      required: [ledger_account, amount, balance_before, balance_after]
      additionalProperties: false
    LedgerTransaction:
      type: object
      properties:
        id: {type: string, format: uuid}
        type: {$ref: '#/components/schemas/TransactionType'}
        idempotency_key: {type: string}
        related:
          anyOf:
          - {$ref: '#/components/schemas/LedgerRelated'}
          - {type: 'null'}
        actor:
          anyOf:
          - {$ref: '#/components/schemas/AccountRef'}
          - {type: 'null'}
        reason: {type: string}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        related_summary: {type: [string, 'null'], description: 关联对象的一句话摘要（调用的模型与渠道、C2C 卖单与交易的数量与单价、账户的用户名）。}
        entries:
          type: array
          items: {$ref: '#/components/schemas/LedgerTransactionEntry'}
        price_snapshot:
          anyOf:
          - {$ref: '#/components/schemas/PriceSnapshot'}
          - {type: 'null'}
          description: 仅详情接口返回：调用类交易记录的价格快照；其他为 null。
        recent_actions:
          type: array
          items: {$ref: '#/components/schemas/AuditEntry'}
          description: 仅详情接口返回：交易涉及用户最近的人工操作（审计），最多 10 条。
      required: [id, type, idempotency_key, related, actor, reason, created_at, related_summary, entries]
      additionalProperties: false
    LedgerTransactionPage:
      type: object
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/LedgerTransaction'}
        next_cursor: {type: [string, 'null'], description: 下一页游标；为 null 表示没有更多。}
      required: [items, next_cursor]
      additionalProperties: false
    LedgerTransactionEnvelope:
      type: object
      properties:
        transaction: {$ref: '#/components/schemas/LedgerTransaction'}
      required: [transaction]
      additionalProperties: false
    RepairCallRequest:
      type: object
      properties:
        action: {type: string, enum: [charge, void], description: charge 按调用记录的用量与价格快照补记账；void 标记为不收费的中断。}
        reason: {type: string, minLength: 1, maxLength: 500}
      required: [action, reason]
      additionalProperties: false
    RepairCallResponse:
      type: object
      properties:
        call: {$ref: '#/components/schemas/CallDetail'}
        transaction_id: {type: [string, 'null'], format: uuid}
      required: [call, transaction_id]
      additionalProperties: false
