        reason: {type: string}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        related_summary: {type: [string, 'null'], description: 关联对象的一句话摘要（调用的模型与渠道、C2C 卖单与交易的数量与单价、账户的用户名）。}
