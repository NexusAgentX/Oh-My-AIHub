# Oh-My-AIHub OpenAPI 契约（ADR-0021）。手工维护；修改后运行 mise run generate 重新生成前端类型。
openapi: 3.1.0
info:
  title: Oh-My-AIHub API
  version: 0.7.0-dev
  description: "Oh-My-AIHub 前后端契约的唯一来源（ADR-0021）。覆盖全部 /api/** JSON 接口；/v1/**、/v1beta/** 外部模型 API 入口只登记路径与认证。\n\n约定：积分金额为十进制字符串（最多 9 位小数）；人民币为整数分（*_fen）；费率为整数纳比率（*_rate_nano，1e9 = 100%）；时间为 RFC 3339；字段统一 snake_case；错误统一为 {\"error\": \"<code>\", \"message\": \"<中文>\", \"request_id\"?: \"...\"}；论坛列表使用页码分页（page / limit → items / total / page / limit）；其余列表使用游标分页（cursor / limit → items / next_cursor）；除 GET/HEAD/OPTIONS 外的 /api 请求须携带与 Host 同源的 Origin。\n\n扩展字段：x-access 声明路由门禁（public 无需会话；session 需会话，允许首次改密前访问；ready 需会话且已完成首次改密；admin 在 ready 基础上需管理员；gateway_key 凭平台 API Key）；x-feature 标明负责实现的 Feature（Epic #170），尚未实现的接口返回 501 not_implemented。契约测试逐项对照路由表、门禁与实现状态。"
servers:
- {url: /, description: 同源部署：开发环境由 Vite 代理，Compose 环境由 Nginx 代理。}
tags:
- {name: contributions, description: 私有市场贡献、完整报告审核与治理}
- {name: forum, description: 登录成员论坛与私密工单}
- {name: instance, description: 实例与健康检查}
- {name: auth, description: 认证与当前账户}
- {name: home, description: 首页}
- {name: models, description: 模型与路由}
- {name: keys, description: API Key}
- {name: channels, description: 渠道}
- {name: calls, description: 调用与用量}
- {name: points, description: 积分}
- {name: c2c, description: C2C 卖单市场}
- {name: admin-accounts, description: 管理员：账户}
- {name: admin-models, description: 管理员：模型目录}
- {name: admin-settings, description: 管理员：设置与操作记录}
- {name: admin-channels, description: 管理员：渠道治理}
- {name: admin-c2c, description: 管理员：C2C 仲裁}
- {name: admin-observe, description: 管理员：观测}
- {name: gateway, description: 外部模型 API 入口}
paths:
  /v1/models/{model}:
    {
      "get": {
        "operationId": "getNativeModel",
        "tags": [
          "gateway"
        ],
        "summary": "Read authorized local native model metadata",
        "x-access": "gateway_key",
        "x-feature": "499",
        "security": [
          {
            "bearerKey": []
          },
          {
            "anthropicKey": []
          },
          {
            "geminiKey": []
          },
          {
            "geminiQueryKey": []
          }
        ],
        "parameters": [
          {
            "in": "path",
            "name": "model",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Native model metadata in the selected protocol",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/NativeModelMetadata"
                }
              }
            }
          },
          "default": {
            "description": "Native protocol error"
          }
        }
      }
    }
