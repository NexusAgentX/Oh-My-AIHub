openapi: "3.1.0"
info: {title: Oh-My-AIHub API, version: "0.1.0", description: "Oh-My-AIHub 前后端契约的唯一来源（见 ADR）。覆盖全部 /api/** JSON 接口；/v1/**、/v1beta/** 外部模型协议入口只登记路径与认证。\n\n约定：金额一律为十进制字符串；时间为 RFC 3339；错误统一为 {\"error\":{\"code\",\"message\"}}；除 GET/HEAD/OPTIONS 外的 /api 请求须携带与 Host 同源的 Origin。\n\n扩展字段 x-access 声明路由门禁，由契约测试与路由表逐项对照：public 无需会话；session 需会话（允许首次改密前访问）；ready 需会话且已完成首次改密；admin 在 ready 基础上需管理员；gateway_key 凭网关 API Key。"}
servers:
  - url: /
    description: "同源部署：开发环境由 Vite 代理，Compose 环境由 Nginx 代理。"
tags:
  - name: instance
    description: "实例与健康检查"
  - name: auth
    description: "认证与账户"
  - name: admin-accounts
    description: "管理员：账户"
  - name: models
    description: "模型目录"
  - name: wallet
    description: "钱包与账本"
  - name: admin-ledger
    description: "管理员：账本"
  - name: channels
    description: "渠道与报价"
  - name: market
    description: "共享市场"
  - name: admin-channels
    description: "管理员：渠道"
  - name: keys
    description: API Key
  - name: calls
    description: "调用记录与看板"
  - name: c2c
    description: "C2C 订单与交易"
  - name: admin-c2c
    description: "管理员：C2C"
  - name: admin-fee-rate
    description: "管理员：手续费率"
  - name: admin-ops
    description: "管理员：运营"
  - name: gateway
    description: "外部模型协议入口"
paths:
  /api/health:
    get:
      operationId: getHealth
      tags: [instance]
      summary: "健康检查"
      x-access: public
      security: []
      responses:
        '200':
          description: "服务与数据库可用。"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Health"}
        '503': {$ref: "#/components/responses/Unavailable"}
  /api/instance:
    get:
      operationId: getInstance
      tags: [instance]
      summary: "实例是否已初始化"
      x-access: public
      security: []
      responses:
        '200':
          description: "成功"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/InstanceState"}
  /api/instance/initialize:
    post:
      operationId: initializeInstance
      tags: [instance]
      summary: "初始化实例并创建首个管理员"
      description: "仅在实例尚无管理员时可用；成功后建立会话并设置会话 Cookie。"
      x-access: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/InstanceInitializeRequest"}
      responses:
        '201':
          description: "已创建管理员并登录。"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/InstanceInitializeResponse"}
        '400': {$ref: "#/components/responses/BadRequest"}
        '403': {$ref: "#/components/responses/Forbidden"}
        '409': {$ref: "#/components/responses/Conflict"}
        '422': {$ref: "#/components/responses/Unprocessable"}
  /api/auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: "登录"
      description: "成功时设置会话 Cookie。"
      x-access: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LoginRequest"}
      responses:
        '200':
          description: "登录成功。"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AccountEnvelope"}
        '400': {$ref: "#/components/responses/BadRequest"}
        '401': {$ref: "#/components/responses/Unauthorized"}
        '403': {$ref: "#/components/responses/Forbidden"}
        '429': {$ref: "#/components/responses/TooManyRequests"}
  /api/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: "退出登录"
      x-access: public
      security: []
      responses:
        '204': {description: "已退出，会话 Cookie 被清除。"}
        '403': {$ref: "#/components/responses/Forbidden"}
  /api/auth/session:
    get:
      operationId: getSession
      tags: [auth]
      summary: "当前会话账户"
      description: "允许仍须首次改密的账户访问。"
      x-access: session
      security:
        - sessionCookie: []
      responses:
        '200':
          description: "成功"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AccountEnvelope"}
        '401': {$ref: "#/components/responses/Unauthorized"}
  /api/account/password:
    put:
      operationId: changePassword
      tags: [auth]
      summary: "修改自己的密码"
      description: "成功后轮换会话 Cookie。"
      x-access: session
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ChangePasswordRequest"}
      responses:
        '200':
          description: "成功"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AccountEnvelope"}
        '400': {$ref: "#/components/responses/BadRequest"}
        '401': {$ref: "#/components/responses/Unauthorized"}
        '403': {$ref: "#/components/responses/Forbidden"}
        '422': {$ref: "#/components/responses/Unprocessable"}
        '429': {$ref: "#/components/responses/TooManyRequests"}
  /api/account:
    get:
      operationId: getAccount
      tags: [auth]
      summary: "当前账户与额度"
      x-access: ready
      security:
        - sessionCookie: []
      responses:
        '200':
          description: "成功"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AccountEnvelope"}
        '401': {$ref: "#/components/responses/Unauthorized"}
        '403': {$ref: "#/components/responses/Forbidden"}
  /api/admin/accounts:
    get:
      operationId: listAccounts
      tags: [admin-accounts]
      summary: "账户列表"
      x-access: admin
      security:
        - sessionCookie: []
      parameters:
        - name: q
          in: query
          required: false
          description: "按用户名或显示名搜索。"
          schema: {type: string}
      responses:
        '200':
          description: "成功"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AccountList"}
        '401': {$ref: "#/components/responses/Unauthorized"}
        '403': {$ref: "#/components/responses/Forbidden"}
    post:
      operationId: createAccount
      tags: [admin-accounts]
      summary: "邀请创建账户"
      x-access: admin
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateAccountRequest"}
      responses:
        '201':
          description: "成功"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AccountWithInitialPassword"}
        '400': {$ref: "#/components/responses/BadRequest"}
        '401': {$ref: "#/components/responses/Unauthorized"}
        '403': {$ref: "#/components/responses/Forbidden"}
        '409': {$ref: "#/components/responses/Conflict"}
        '422': {$ref: "#/components/responses/Unprocessable"}
        '429': {$ref: "#/components/responses/TooManyRequests"}
  /api/admin/accounts/{accountID}:
    patch:
      operationId: updateAccount
      tags: [admin-accounts]
      summary: "更新账户"
      x-access: admin
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/accountID"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UpdateAccountRequest"}
      responses:
        '200':
          description: "成功"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AccountEnvelope"}
        '400': {$ref: "#/components/responses/BadRequest"}
        '401': {$ref: "#/components/responses/Unauthorized"}
        '403': {$ref: "#/components/responses/Forbidden"}
        '404': {$ref: "#/components/responses/NotFound"}
        '409': {$ref: "#/components/responses/Conflict"}
        '422': {$ref: "#/components/responses/Unprocessable"}
  /api/admin/accounts/{accountID}/password-reset:
    post:
      operationId: resetAccountPassword
      tags: [admin-accounts]
      summary: "重置账户密码"
      description: "不能重置自己的密码。"
      x-access: admin
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/accountID"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/EmptyRequest"}
      responses:
        '200':
          description: "成功"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AccountWithInitialPassword"}
        '400': {$ref: "#/components/responses/BadRequest"}
        '401': {$ref: "#/components/responses/Unauthorized"}
        '403': {$ref: "#/components/responses/Forbidden"}
        '404': {$ref: "#/components/responses/NotFound"}
        '422': {$ref: "#/components/responses/Unprocessable"}
        '429': {$ref: "#/components/responses/TooManyRequests"}
  /api/models:
    get:
      operationId: listModels
      tags: [models]
      summary: "模型列表"
      x-access: ready
      security:
        - sessionCookie: []
      parameters:
        - name: q
          in: query
          required: false
          description: "按名称或 ID 搜索。"
          schema: {type: string}
      responses:
        '200':
          description: "成功"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ModelList"}
        '401': {$ref: "#/components/responses/Unauthorized"}
        '403': {$ref: "#/components/responses/Forbidden"}
  /api/models/{modelID}:
    get:
      operationId: getModel
      tags: [models]
      summary: "模型详情"
      x-access: ready
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/modelID"
      responses:
        '200':
          description: "成功"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ModelEnvelope"}
        '401': {$ref: "#/components/responses/Unauthorized"}
        '403': {$ref: "#/components/responses/Forbidden"}
        '404': {$ref: "#/components/responses/NotFound"}
  /api/admin/models:
    get:
      operationId: listAdminModels
      tags: [models]
      summary: "管理员：模型列表"
      x-access: admin
      security:
        - sessionCookie: []
      parameters:
        - name: q
          in: query
          required: false
          description: "按名称或 ID 搜索。"
          schema: {type: string}
      responses:
        '200':
          description: "成功"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ModelList"}
        '401': {$ref: "#/components/responses/Unauthorized"}
        '403': {$ref: "#/components/responses/Forbidden"}
    post:
      operationId: createModel
      tags: [models]
      summary: "管理员：创建模型"
      x-access: admin
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ModelRequest"}
      responses:
        '201':
          description: "成功"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ModelEnvelope"}
        '400': {$ref: "#/components/responses/BadRequest"}
        '401': {$ref: "#/components/responses/Unauthorized"}
        '403': {$ref: "#/components/responses/Forbidden"}
        '409': {$ref: "#/components/responses/Conflict"}
        '422': {$ref: "#/components/responses/Unprocessable"}
  /api/admin/models/{modelID}:
    get:
      operationId: getAdminModel
      tags: [models]
      summary: "管理员：模型详情"
      x-access: admin
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/modelID"
      responses:
        '200':
          description: "成功"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ModelEnvelope"}
        '401': {$ref: "#/components/responses/Unauthorized"}
        '403': {$ref: "#/components/responses/Forbidden"}
        '404': {$ref: "#/components/responses/NotFound"}
    put:
      operationId: updateModel
      tags: [models]
      summary: "管理员：更新模型"
      x-access: admin
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/modelID"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ModelRequest"}
      responses:
        '200':
          description: "成功"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ModelEnvelope"}
        '400': {$ref: "#/components/responses/BadRequest"}
        '401': {$ref: "#/components/responses/Unauthorized"}
        '403': {$ref: "#/components/responses/Forbidden"}
        '404': {$ref: "#/components/responses/NotFound"}
        '409': {$ref: "#/components/responses/Conflict"}
        '422': {$ref: "#/components/responses/Unprocessable"}
  /api/wallet:
    get:
      operationId: getWallet
      tags: [wallet]
      summary: "我的钱包"
      x-access: ready
      security:
        - sessionCookie: []
      responses:
        '200':
          description: "成功"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WalletResponse"}
        '401': {$ref: "#/components/responses/Unauthorized"}
        '403': {$ref: "#/components/responses/Forbidden"}
  /api/wallet/entries:
    get:
      operationId: listWalletEntries
      tags: [wallet]
      summary: "我的账本分录"
      x-access: ready
      security:
        - sessionCookie: []
      parameters:
        - name: limit
          in: query
          required: false
          description: "返回条数。"
          schema: {type: integer, default: 20}
        - name: before
          in: query
          required: false
          description: "分录 ID 游标，返回早于该分录的记录。"
          schema: {type: string, pattern: "^[0-9]+$"}
      responses:
        '200':
          description: "成功"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LedgerEntryPage"}
        '401': {$ref: "#/components/responses/Unauthorized"}
        '403': {$ref: "#/components/responses/Forbidden"}
        '422': {$ref: "#/components/responses/Unprocessable"}
  /api/admin/ledger/metrics:
    get:
      operationId: getLedgerMetrics
      tags: [admin-ledger]
      summary: "账本一致性指标"
      x-access: admin
      security:
        - sessionCookie: []
      responses:
        '200':
          description: "成功"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LedgerMetricsEnvelope"}
        '401': {$ref: "#/components/responses/Unauthorized"}
        '403': {$ref: "#/components/responses/Forbidden"}
  /api/admin/ledger/accounts/{accountID}/wallet:
    get:
      operationId: getAdminLedgerAccountWallet
      tags: [admin-ledger]
      summary: "用户账户钱包"
      x-access: admin
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/accountID"
      responses:
        '200':
          description: "成功"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WalletEnvelope"}
        '401': {$ref: "#/components/responses/Unauthorized"}
        '403': {$ref: "#/components/responses/Forbidden"}
        '404': {$ref: "#/components/responses/NotFound"}
  /api/admin/ledger/accounts/{accountID}/entries:
    get:
      operationId: listAdminLedgerAccountEntries
      tags: [admin-ledger]
      summary: "用户账户账本分录"
      x-access: admin
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/accountID"
        - name: limit
          in: query
          required: false
          description: "返回条数。"
          schema: {type: integer, default: 20}
        - name: before
          in: query
          required: false
          description: "分录 ID 游标。"
          schema: {type: string, pattern: "^[0-9]+$"}
      responses:
        '200':
          description: "成功"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LedgerEntryPage"}
        '401': {$ref: "#/components/responses/Unauthorized"}
        '403': {$ref: "#/components/responses/Forbidden"}
        '404': {$ref: "#/components/responses/NotFound"}
        '422': {$ref: "#/components/responses/Unprocessable"}
  /api/admin/ledger/system-accounts/{systemKind}/wallet:
    get:
      operationId: getAdminLedgerSystemWallet
      tags: [admin-ledger]
      summary: "系统账户钱包"
      x-access: admin
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/systemKind"
      responses:
        '200':
          description: "成功"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WalletEnvelope"}
        '401': {$ref: "#/components/responses/Unauthorized"}
        '403': {$ref: "#/components/responses/Forbidden"}
        '404': {$ref: "#/components/responses/NotFound"}
  /api/admin/ledger/system-accounts/{systemKind}/entries:
    get:
      operationId: listAdminLedgerSystemEntries
      tags: [admin-ledger]
      summary: "系统账户账本分录"
      x-access: admin
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/systemKind"
        - name: limit
          in: query
          required: false
          description: "返回条数。"
          schema: {type: integer, default: 20}
        - name: before
          in: query
          required: false
          description: "分录 ID 游标。"
          schema: {type: string, pattern: "^[0-9]+$"}
      responses:
        '200':
          description: "成功"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LedgerEntryPage"}
        '401': {$ref: "#/components/responses/Unauthorized"}
        '403': {$ref: "#/components/responses/Forbidden"}
        '404': {$ref: "#/components/responses/NotFound"}
        '422': {$ref: "#/components/responses/Unprocessable"}
  /api/admin/ledger/adjustments:
    post:
      operationId: createLedgerAdjustment
      tags: [admin-ledger]
      summary: "管理员账本调整"
      x-access: admin
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Idempotency-Key"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LedgerAdjustmentRequest"}
      responses:
        '200':
          description: "成功"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LedgerTransactionEnvelope"}
        '400': {$ref: "#/components/responses/BadRequest"}
        '401': {$ref: "#/components/responses/Unauthorized"}
        '403': {$ref: "#/components/responses/Forbidden"}
        '409': {$ref: "#/components/responses/Conflict"}
        '422': {$ref: "#/components/responses/Unprocessable"}
  /api/admin/ledger/bad-debts:
    post:
      operationId: createBadDebtTransfer
      tags: [admin-ledger]
      summary: "坏账划转"
      x-access: admin
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Idempotency-Key"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/BadDebtRequest"}
      responses:
        '200':
          description: "成功"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LedgerTransactionEnvelope"}
        '400': {$ref: "#/components/responses/BadRequest"}
        '401': {$ref: "#/components/responses/Unauthorized"}
        '403': {$ref: "#/components/responses/Forbidden"}
        '409': {$ref: "#/components/responses/Conflict"}
        '422': {$ref: "#/components/responses/Unprocessable"}
  /api/channels:
    get:
      operationId: listChannels
      tags: [channels]
      summary: "我的渠道"
      x-access: ready
      security:
        - sessionCookie: []
      responses:
        '200':
          description: "成功"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OwnerChannelList"}
        '401': {$ref: "#/components/responses/Unauthorized"}
        '403': {$ref: "#/components/responses/Forbidden"}
    post:
      operationId: createChannel
      tags: [channels]
      summary: "创建渠道"
      x-access: ready
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateChannelRequest"}
      responses:
        '201':
          description: "成功"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OwnerChannelEnvelope"}
        '400': {$ref: "#/components/responses/BadRequest"}
        '401': {$ref: "#/components/responses/Unauthorized"}
        '403': {$ref: "#/components/responses/Forbidden"}
        '409': {$ref: "#/components/responses/Conflict"}
        '422': {$ref: "#/components/responses/Unprocessable"}
  /api/channels/{channelID}:
    get:
      operationId: getChannel
      tags: [channels]
      summary: "我的渠道详情"
      x-access: ready
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/channelID"
      responses:
        '200':
          description: "成功"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OwnerChannelEnvelope"}
        '401': {$ref: "#/components/responses/Unauthorized"}
        '403': {$ref: "#/components/responses/Forbidden"}
        '404': {$ref: "#/components/responses/NotFound"}
    patch:
      operationId: updateChannel
      tags: [channels]
      summary: "更新渠道"
      x-access: ready
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/channelID"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UpdateChannelRequest"}
      responses:
        '200':
          description: "成功"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OwnerChannelEnvelope"}
        '400': {$ref: "#/components/responses/BadRequest"}
        '401': {$ref: "#/components/responses/Unauthorized"}
        '403': {$ref: "#/components/responses/Forbidden"}
        '404': {$ref: "#/components/responses/NotFound"}
        '409': {$ref: "#/components/responses/Conflict"}
        '422': {$ref: "#/components/responses/Unprocessable"}
    delete:
      operationId: deleteChannel
      tags: [channels]
      summary: "删除渠道"
      description: "DELETE 请求携带 JSON 请求体（expected_version）。"
      x-access: ready
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/channelID"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/VersionedRequest"}
      responses:
        '200':
          description: "成功"
          content:
