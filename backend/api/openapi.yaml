components:
  securitySchemes:
    sessionCookie: {type: apiKey, in: cookie, name: oma_session, description: 登录后由服务端设置的 HttpOnly 会话 Cookie。}
    bearerKey: {type: http, scheme: bearer, description: '平台 API Key：Authorization: Bearer <key>（OpenAI 格式）。'}
    anthropicKey: {type: apiKey, in: header, name: x-api-key, description: 平台 API Key（Anthropic 格式）。}
    geminiKey: {type: apiKey, in: header, name: x-goog-api-key, description: 平台 API Key（Gemini 格式）。}
    geminiQueryKey: {type: apiKey, in: query, name: key, description: 平台 API Key（Gemini 查询参数形式）。}
  parameters:
    accountID:
      name: accountID
      in: path
      required: true
      description: 账户 ID。
      schema: {type: string, format: uuid}
    modelID:
      name: modelID
      in: path
      required: true
      description: 模型名。
      schema: {type: string}
    keyID:
      name: keyID
      in: path
      required: true
      description: API Key ID。
      schema: {type: string, format: uuid}
    channelID:
      name: channelID
      in: path
      required: true
      description: 渠道 ID。
      schema: {type: string, format: uuid}
    callID:
      name: callID
      in: path
      required: true
      description: 调用（请求）ID。
      schema: {type: string, format: uuid}
    orderID:
      name: orderID
      in: path
      required: true
      description: C2C 卖单 ID。
      schema: {type: string, format: uuid}
    tradeID:
      name: tradeID
      in: path
      required: true
      description: C2C 交易 ID。
      schema: {type: string, format: uuid}
    transactionID:
      name: transactionID
      in: path
      required: true
      description: 账本交易 ID。
      schema: {type: string, format: uuid}
    model:
      name: model
      in: path
      required: true
      description: 模型名与动作，例如 `gemini-2.5-flash:generateContent`。
      schema: {type: string}
    cursor:
      name: cursor
      in: query
      required: false
      description: 上一页返回的 next_cursor。
      schema: {type: string}
    limit:
      name: limit
      in: query
      required: false
      description: 每页条数，1～100，默认 20。
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    from:
      name: from
      in: query
      required: false
      description: 开始时间（含）。
      schema: {type: string, format: date-time}
    to:
      name: to
      in: query
      required: false
      description: 结束时间（不含）。
      schema: {type: string, format: date-time}
    q:
      name: q
      in: query
      required: false
      description: 搜索关键字。
      schema: {type: string}
    modelQuery:
      name: model
      in: query
      required: false
      description: 模型名。
      schema: {type: string}
    outcome:
      name: outcome
      in: query
      required: false
      description: 结果分类。
      schema: {$ref: '#/components/schemas/CallOutcome'}
    apiKeyIDQuery:
      name: api_key_id
      in: query
      required: false
      description: API Key ID。
      schema: {type: string, format: uuid}
    accountIDQuery:
      name: account_id
      in: query
      required: false
      description: 账户 ID。
      schema: {type: string, format: uuid}
    channelIDQuery:
      name: channel_id
      in: query
      required: false
      description: 渠道 ID。
      schema: {type: string, format: uuid}
    tag:
      name: tag
      in: query
      required: false
      description: 调用标签（X-AIHub-Tag）。
      schema: {type: string}
    format:
      name: format
      in: query
      required: false
      description: API 格式。
      schema: {$ref: '#/components/schemas/Format'}
    groupBy:
      name: group_by
      in: query
      required: false
      description: 聚合维度；channel 仅在 view=revenue 时有效。
      schema: {type: string, enum: [day, model, key, tag, channel], default: day}
    transactionType:
      name: type
      in: query
      required: false
      description: 交易类型。
      schema: {$ref: '#/components/schemas/TransactionType'}
    exportFormat:
      name: format
      in: query
      required: false
      description: json（默认）或 csv。
      schema: {type: string, enum: [json, csv], default: json}
    accountStatus:
      name: status
      in: query
      required: false
      description: 账户状态。
      schema: {$ref: '#/components/schemas/AccountStatus'}
    channelStatus:
      name: status
      in: query
      required: false
      description: 渠道状态。
      schema: {$ref: '#/components/schemas/ChannelStatus'}
    ownerID:
      name: owner_id
      in: query
      required: false
      description: 所有者账户 ID。
      schema: {type: string, format: uuid}
    tradeRole:
      name: role
      in: query
      required: false
      description: 我的角色。
      schema: {type: string, enum: [buyer, seller]}
    tradeStatus:
      name: status
      in: query
      required: false
      description: 交易状态。
      schema: {$ref: '#/components/schemas/TradeStatus'}
    orderStatus:
      name: status
      in: query
      required: false
      description: 卖单状态。
      schema: {$ref: '#/components/schemas/OrderStatus'}
    tradePending:
      name: pending
      in: query
      required: false
      description: 为 true 时只返回待我处理的交易：我是买家且待付款，或我是卖家且已付款待放行。
      schema: {type: boolean}
    auditAction:
      name: action
      in: query
      required: false
      description: 操作类型，例如 account.created。
      schema: {type: string}
    targetType:
      name: target_type
      in: query
      required: false
      description: 对象类型，例如 account、model。
      schema: {type: string}
    targetID:
      name: target_id
      in: query
      required: false
      description: 对象 ID。
      schema: {type: string}
    actorID:
      name: actor_id
      in: query
      required: false
      description: 操作者账户 ID。
      schema: {type: string, format: uuid}
    requestID:
      name: request_id
      in: query
      required: false
      description: 请求 ID，精确匹配。
      schema: {type: string, format: uuid}
    streamQuery:
      in: query
      name: stream
      schema: {type: boolean}
    minAttempts:
      in: query
      name: min_attempts
      schema: {type: integer}
    maxAttempts:
      in: query
      name: max_attempts
      schema: {type: integer}
    statusCodeQuery:
      in: query
      name: status_code
      schema: {type: integer}
    errorCodeQuery:
      in: query
      name: error_code
      schema: {type: string}
    endReasonQuery:
      in: query
      name: end_reason
      schema: {type: string}
    deliveryQuery:
      in: query
      name: delivery
      schema: {type: string}
    usageStatusQuery:
      in: query
      name: usage_status
      schema: {type: string}
    billedQuery:
      in: query
      name: billed
      schema: {type: boolean}
    attemptChannelQuery:
      in: query
      name: attempt_channel_id
      schema: {type: string}
    dimensionQuery:
      in: query
      name: dimension
      schema: {type: string, enum: [all, model, channel, format, stream, key, tag, account, outcome, error, error_code, status, stop, service_tier]}
    dimensionValueQuery:
      in: query
      name: dimension_value
      schema: {type: string}
    secondDimensionQuery:
      in: query
      name: second_dimension
      schema: {type: string, enum: [all, model, channel, format, stream, key, tag, account, outcome, error, error_code, status, stop, service_tier]}
    secondValueQuery:
      in: query
      name: second_value
      schema: {type: string}
    minDurationMs:
      name: min_duration_ms
      in: query
      required: false
      description: 总耗时下限（毫秒，含）。
      schema: {type: integer, minimum: 0}
    maxDurationMs:
      name: max_duration_ms
      in: query
      required: false
      description: 总耗时上限（毫秒，含）。
      schema: {type: integer, minimum: 0}
    minTokens:
      name: min_tokens
      in: query
      required: false
      description: 总 tokens（输入 + 输出 + 缓存读写）下限（含）。
      schema: {type: integer, minimum: 0}
    maxTokens:
      name: max_tokens
      in: query
      required: false
      description: 总 tokens 上限（含）。
      schema: {type: integer, minimum: 0}
    minCost:
      name: min_cost
      in: query
      required: false
      description: 实际扣除（费用 + 手续费）下限（含）。
      schema: {$ref: '#/components/schemas/Amount'}
    maxCost:
      name: max_cost
      in: query
      required: false
      description: 实际扣除（费用 + 手续费）上限（含）。
      schema: {$ref: '#/components/schemas/Amount'}
    usageView:
      name: view
      in: query
      required: false
      description: spend 为我的消费（默认）；revenue 为我的渠道收入。
      schema: {type: string, enum: [spend, revenue], default: spend}
    pointsGroup:
      name: group
      in: query
      required: false
      description: 汇总方式：day 或 key；省略则不返回 summary。
      schema: {type: string, enum: [day, key]}
    trendDays:
      name: days
      in: query
      required: false
      description: 走势时间窗（天），7、30 或 90。
      schema: {type: integer, enum: [7, 30, 90], default: 30}
    relatedType:
      name: related_type
      in: query
      required: false
      description: 关联对象类型，需与 related_id 同时给出。
      schema: {type: string, enum: [call, c2c_order, c2c_trade, account]}
    relatedID:
      name: related_id
      in: query
      required: false
      description: 关联对象 ID。
      schema: {type: string, format: uuid}
    Idempotency-Key:
      name: Idempotency-Key
      in: header
      required: false
      description: 幂等键；相同键重复提交返回同一结果，不重复记账。
      schema: {type: string, maxLength: 128}
  responses:
    BadRequest:
      description: 请求格式无效或参数非法（invalid_json、invalid_request、invalid_cursor）。
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Unauthorized:
      description: 未登录或会话失效（authentication_required）。
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Forbidden:
      description: 被拒绝：跨站请求（cross_origin_request）、首次登录须改密（password_change_required）、需要管理员（administrator_required）或无权操作（forbidden）。
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    NotFound:
      description: 资源不存在（not_found）。
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Conflict:
      description: 状态冲突（conflict、already_initialized、last_administrator、idempotency_conflict 等）。
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Unprocessable:
      description: 业务校验失败（invalid_input、nothing_to_write_off、cannot_modify_self、unsafe_upstream 等）。
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    TooManyRequests:
      description: 触发限流或服务繁忙（login_rate_limited、password_rate_limited、*_busy）。
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Unavailable:
      description: 服务暂不可用（database_unavailable）。
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    BadGateway:
      description: 上游不可达或返回错误（upstream_error）。
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    NotImplemented:
      description: 接口已在契约中定义但尚未实现（not_implemented）。
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
  schemas:
    CodexNativeCatalog:
      {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "models"
        ],
        "properties": {
          "models": {
            "type": "array",
            "items": {
              "type": "object",
              "required": [
                "slug",
                "display_name"
              ],
              "properties": {
                "slug": {
                  "type": "string"
                },
                "display_name": {
                  "type": "string"
                }
              },
              "additionalProperties": true
            }
          }
        }
      }
    CodexNativeJSON:
      {}
    CodexPlatformIdentity:
      {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "email",
          "chatgpt_user_id",
          "chatgpt_account_id",
          "chatgpt_plan_type",
          "chatgpt_account_is_fedramp"
        ],
        "properties": {
          "email": {
