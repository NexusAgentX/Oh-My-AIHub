      summary: 调用多维分析
      description: 与调用列表同一筛选，最多366天；分位直接来自样本。channel 为最终渠道，error/status 为最后尝试；空值为未采集。前期对比使用紧邻且等长时间窗。最多1000分组，超限返回400要求缩小范围，不截断。
