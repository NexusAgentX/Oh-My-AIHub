      "gateway/capacity-search": "后台参数契约见 components/schemas/GatewayCapacitySearch；上下文与最大输出分别配置，任务固定版本。无平台累计费用/HTTP/token/图片/工具/总时长硬预算。范围与轮数属于有限算法，前置失败/短回答/外部错误不当长度上界。",
      "gateway/creation-ownership": "可信创建返回在暴露 ID 前原子登记账号/平台 Key、操作 ID、原 Binding 和受保护的真实凭据等值标签；同组同实际上游 Key 的不同渠道共享原生 ID 碰撞域。碰撞须保留隔离标记，旧归属也不可继续读取可能已被替换的数据。非创建列表/客户端自报 ID 不证明首次归属；子项先核验父级。正式持久化归 F1/F7，检测 fixture 不代替事务索引。",
      "gateway/pagination": "在服务端过滤未登记/他人资源，重算返回列表的首末 ID/has_more，不透出共享 totals；默认原型每页至多100项、单次最多4页/合计1MiB，空页仍可给继续游标。原生游标以32字节保护密钥的AES-GCM封装，绑定账号/Key/资源/父级/规范化请求摘要；标准资源另绑原 Binding，context 游标不含渠道来源。原生游标至多2048字节，拒绝重复/超长/篡改，正式适配器先限制网络读取并映射原生分页字段。",
      "codex-special/first-context-ownership": "维护者第32条已确认会话编号隔离：使用现有密钥环加密持久化的稳定随机根密钥，对平台账号ID、平台Key ID和原始session/thread标识作长度分隔HMAC-SHA256，生成UUIDv8内部编号。命名空间不含供应商/分组/渠道/上游凭据，原始ID相同的其他账号/Key得到不同内部ID，猜到他人内部ID也不能逃逸自身命名空间。新会话可在经过此隔离后安全初始化；普通标准远端资源仍不能凭自报ID认领。",
      "codex-special/profiles": "固定0.163.0：内置openai provider及平台身份兼容。history/notes配置 features.token_budget.enabled=true、use_history_notes_extension=true；后台V2另用 features.async_compaction.enabled=true 且 token_budget.enabled=false、use_history_notes_extension=false，要求provider远程压缩能力V2。两配置互斥，不把两开关均true当生效证明。remote_compaction_v2在该版本已是移除的无效开关。",
      "codex-special/compaction": "V1原生POST codex/responses/compact；V2通过普通codex/responses输入type=compaction_trigger，返回完整type=compaction窗口并续用；后台V2是客户端执行方式，非background=true，不是context_management。固定源码sources/codex，三层证据独立，当前CLI原型未证明压缩实际触发。",
      "gateway/evidence-layers": "upstream_protocol、gateway_proxy、official_cli分别记录目标、方法/路径、模型/凭据范围摘要、代码/客户端/配置/范围版本及结果；官方CLI+合成后端证据仅official_cli_with_synthetic_backend，不能投影真实供应商能力。client_not_enabled、configuration_error、platform_endpoint_pending、detector_error与真实unsupported分别归类。",
      "codex-special/images": "固定源码codex-api/src/images.rs及endpoint/images.rs：generations和edits均原生JSON；edits含images[{image_url}]，不依赖Files。字段model为实际图像模型，非主对话模型；模型/权限/报价单独核验。ImageReference::File仅表示源码形态，不授权共享外部file_id。",
      "gateway/item-reference": "原生item_reference可能仅含id：按可信索引的账号/Key与原始父级元数据解析，唯一才绑定；有显式父级时严格校验。跨父级/来源同ID无法消歧时拒绝，不以空父级错误拒绝所有已登记项。",
      "gateway/entry-contract": "正式入口由F7/F8同时接入Nginx/Vite；外部/v1、/v1beta与/backend-api命名空间统一Key鉴权、无正文/凭据请求日志、32MiB JSON/SSE/multipart上界、关闭磁盘临时缓冲和流式缓冲。网页同源/Origin规则继续用于/api会话写请求，不把它误用于SDK平台代理。固定出站不从model/资源ID/返回URL构造任意主机。",
      "gateway/reference-extraction": "仅识别协议定义的previous_response_id、conversation、item_reference、cachedContent等明确远端引用。完整reasoning/compaction及thinking签名和未知扩展不递归猜测为资源；单独prompt_cache_key/session/thread不引入来源绑定。",
      "codex-special/context-wire-mapping": "只处理固定CLI的context.session_id、client_metadata的session_id/thread_id/x-codex-parent-thread-id及x-codex-turn-metadata内session_id/thread_id/parent_thread_id/forked_from_thread_id；对应HTTP头session-id/thread-id/x-client-request-id/x-codex-parent-thread-id/x-codex-turn-metadata使用同一映射。不递归改input/opaque item id、window/item引用、notes路径、正文或密文，不改current_agent_name。只在Codex上下文协议启用，未知扩展原样保留；重复标识/头拒绝，空值可选metadata保留。解压/映射/模型替换后由F8正确重建编码与长度。",
      "codex-special/context-key-lifecycle": "保护根密钥以现有渠道密钥环加密持久化，重启/轮换只重新封装，不能随activeKeyID变化重新生成；解密失败拒绝相关入口启动。新实现不得存请求/笔记/密文正文来补隔离，也不得加入来源路由粘性。F1提供保护密钥元数据，F7/F8实现初始化/加载/轮换与实际入口；F0提供可重复权限原型。",
      "detection/native-evidence": "F4 按原生协议逐项验证结构、语义与可靠用量；真实长度与参数接受独立，搜索额外计数请求纳入实际消耗。SSE 使用原生流式端点，计数/压缩场景允许调用对应原生生成端点验证完整窗口续用。指纹固定 lmfpd 0.0.1792242250521 / 50a364bc686279094265f34f18f5501eac1d73f4，三条完整样本、离线 Go 等价评分，只保存库内相对排名，不证明身份。",
      "detection/native-applicability": "保留每个原始 ID 的场景归属，将通用模板断言细化为实际原生字段。Messages 不虚构 json_object/custom/namespace；Gemini 使用 allowedFunctionNames、VALIDATED、parametersJsonSchema 和 responseJsonSchema，不加入旧 responseSchema 专项；Chat SSE 不虚构原生推理事件。OpenAI custom、allowed_tools 及 Responses namespace 分别验证，temperature/top_p/effort/verbosity 分开投影。缺少偶发多调用或可选 thinking/签名事件只按明确条件断言记录未观测，不代替主动适用检测。",
      "detection/group-negative-prerequisite": "分组基础负例先复用同一凭据/协议的有界模型目录，从实际返回的模型 ID 构造合法基础体，再分别执行无效/缺失鉴权、随机未知模型和无效 JSON。模型元数据仅作请求构造和元数据结构证据，不提升为容量支持；Gemini 多候选额外使用其原生流式端点。",
      "detection/native-multimodal-fixtures": "多模态探测仅使用固定提交和 SHA-256 校验的自有合成资源，URL 使用无答案提示的文件名。图片以左右色块及双图次序核验；PDF 以两页独立代码核验。Chat 官方协议不支持文件 URL，故其 M06 只测原生 file_data；不虚构 file_url 或转入 Files API。Messages PDF citations 启用后核验 document_index 与 1 起始、右端不含的页范围及真实引用；其他协议可选引用只在观测时验证，不补独立文件授权。",
      "openai-responses/M04": "保留原 M04 作为明确命名的供应商扩展 input_audio/data/format 探测，不伪称 OpenAI Responses 官方音频协议。官方文档当前将这种音频会话形态放在 Chat Completions，Responses 创建参考中也没有 input_audio/output_audio。按扩展实际返回/内容识别/用量如实报告，不用 Chat 成功代证 Responses，不新增独立 Audio、Realtime 或 WS 端点，不做协议转换。",
      "native-generate-content/audio-video": "音视频限当前已约定的 GenerateContent v1beta 原生形态，输入使用 inline WAV/MP4，视频另测合法固定 URL。音频输出使用该协议的 AUDIO/speechConfig profile；不因文档新增 Interactions 或 voices 资源而扩张本轮端点/资源管理范围。",
      "images/native-products": "图像模型独立取目标 model_id；所有启用的计价选择器分别取得产物证据，只有计价单位不同的相同请求可共用实际调用。主组合补 JSON/SSE、edits 的 inline/固定 URL/multipart、多图及 mask，避免笛卡尔积。固定 PNG 输出实际解码核对尺寸/产物数，mask 用合成双色图核验修改区与保护区；质量和实际 service_tier 无回显不冒充确认。仅存尺寸/格式/透明度/计量与断言元数据，不保存图片、URL 或 revised_prompt，也不抓取任意返回 URL。Variations 官方已退役，按本轮明确保留的原生 multipart 接口检测供应商兼容，不转换成 edits、不静默删除。Responses/Images 的可靠用量缺失则明确保留未定价 token，不从图片数量推算 token。图像 SSE 单事件允许至单响应上限，仍受同一 32MiB 响应及后台工作槽位约束。",
      "messages/native-compaction": "Messages A-M08 固定检测当前原生按需压缩 beta compact-2026-09-04 / compaction:{type:summarize}，返回带 content/signature 的 compaction block，完整放在后续 messages 开头并移除已被汇总的明文历史，不新增专用资源接口。不触发旧阈值模式所需的大段额外输入，也不把不同机制混作通过。计数、实际压缩和完整压缩回放分别投影；调用内 usage.iterations 与根 usage 分开求和，缺失/非法不猜。",
      "detection/replay-evidence-owner": "F4 upstream_protocol 层证明当前原生配置、完整 opaque/签名/压缩内容可原样提交并继续，字段命名明确为 self_contained_replay_without_resource_reference；真正的跨渠道正常路由/故障转移由既定 F7/F8/F10/F12 网关验收证明。不把单个上游成功冒充平台已无粘性，不改变维护者无粘性决定。",
      "detection/partial-rollout": "部分套件已实现时执行其原生场景并保存真实证据，未实现套件保留在同一完整计划内，最终为 suite_pending 且 complete=false，不能审核创建。不因 F8 尚未落地阻止 F4 直接上游验收，也不靠删掉 F8 分母完成报告。完全没有可执行套件时仍直接待实现；恢复不重复已完成场景。",
      "detection/owned-state": "Responses previous_response_id 三轮、conversation 流和 item_reference 分别投影，覆盖自己刚创建的响应/会话/条目取改删及有限分页；Stored Chat 同理。列表只用于当前任务已知资源的观察/分页，不据返回列表接管或清理其他 ID。查询/取消/续流不会重复统计此前推理用量；background 轮询至多8次，starting_after 从已知序号恢复验证有限片段和权威终态，不能用片段冒充完整 SSE 生命周期。只清理已由本次创建响应及持久元数据证明归属的资源；不等待 TTL，不保存正文。",
      "detection/group-entrance-fallback": "同组入口仍共用唯一能力结论，单次调用共享一个超时。未写出请求头的连接失败可按顺序换入口；已经写出推理/写请求不自动重发，只读 GET 可在自然连接错误/502/503/504 后按顺序尝试。非法/缺失认证负例和正文保护不靠换地址绕过。每个实际尝试保留 entry_url/HTTP/发送状态诊断，精确请求缓存不按地址拆分；地址变更继续不使能力报告失效。0020 仅追加检测追溯列，不改历史账本/用户/余额。",
      "detection/cache-tier-facts": "缓存接受、即时写/读计数与服务档位独立保存。OpenAI in_memory/24h、Messages 5m/1h 分别真实写读，不等待到期；短期未命中只记未确认，不虚构不支持或保持时长。Gemini 显式缓存只操作当前创建资源，真实生成/流式/计数后删除。每个启用档位各发有意义请求，不与所有功能全排列；Anthropic priority 用原生 auto 请求，standard 用 standard_only，实际 usage 可降到 standard，不能把 auto 接受冒充 priority。Gemini 从原生 usageMetadata.serviceTier/合法实际返档头核验；相互矛盾或缺失留未知。只保留固定/配置选择器、白名单实际档位及数值，不保存任意上游字符串或缓存正文。G-C08 continuationToken 续用另需独立实现，不能由缓存通过代证。",
      "gemini/G-C08": "continuationToken 独立场景，不能由显式缓存通过代证。复用真实 JSON 控制长度请求，在原生候选返回 MAX_TOKENS/CONTINUATION 与 token 时保持原 contents 不变、完整携带 opaque token 并单调增加总输出上限，验证一次真实后续 hop/逐次 usage；不追加先前输出，不把 SDK 自动累计再相加。未出现 token 记无法确认，不假造 token、不换成文档示例模型，也不为触发每 hop 32K/64K 阈值另开耐久/吞吐长跑。只保存断言/数值及真实尝试元数据，不保存 token 或正文。",
      "detection/fixed-sdk": "Messages/GenerateContent 各使用一个固定官方 Go SDK 版本真实构造、发送并解析基础请求；SDK本身不放入网关server进程。单独应用制品 aihub-detection-sdk 在 fresh HOME/显式环境的受控子进程中运行，避免 Google SDK 无条件读取宿主环境/ADC。子进程只持一次性回环桥令牌与占位Key，真实测试Key始终留在 Session.Do 固定出站中。桥限制为当前模型/已登记单个原生端点及一次请求，关闭SDK重试/自动续用，短答响应限256KiB，正文/SDK原始错误不入报告。启动核验SDK实际构建版本和制品SHA，版本加入计划CodeVersion；缺制品不注册相应套件，保留待实现而非冒充检测完成。两SDK直接依赖仅由独立worker使用：Anthropic MIT、Google Apache-2.0；SDK的资源/WS类型不表示网关开放这些范围外接口。",
      "detection/builtins": "调用内工具固定为 Responses web_search/code_interpreter/image_generation，Messages web_search_20250305/code_execution_20250825，GenerateContent googleSearch/urlContext/codeExecution/IMAGE及GOOGLE_SEARCH_WEB、URL_CONTEXT原生ToolCall/ToolResponse整块回放。只有实际工具块、关联结果、可核验语义/产物支持能力；auto未调用为未知，缺代码执行计费回执不从container_id猜费用。不下载工具输出文件，不开放容器/工具资源CRUD。",
      "detection/mcp": "远端MCP仅使用本应用固定合成fixture v1（JSON Streamable HTTP 2025-06-18/2025-03-26）：每任务随机临时Bearer令牌，固定空参数只读工具返回未写入提示的随机marker，须同时有实际回调与上游原生结果。Responses测试always审批请求及明确批准后执行，Messages固定mcp-client-2025-11-20和mcp_toolset精确allowlist。AIHUB_DETECTION_PUBLIC_ORIGIN配置本应用公网HTTPS origin；缺配置保持MCP套件pending，不减全测分母。回调不接收平台Key/宿主认证/文件/任意URL，不持久化正文，单探针64请求/4工具调用、16活跃探针、请求16KiB均为局部资源保护。",
      "detection/version-quota": "GenerateContent分组分别验证v1与v1beta原生模型目录，独立子断言，不由一版本推导另一版本；G-C09元数据归目录场景。余额/配额原生适配范围为已固定六种OpenAI/Anthropic剩余量header；共享真实目录请求，字段缺失为条件未观测，数字错误独立失败，不等待重置、不诱发额度耗尽。固定原生推理Key契约没有统一金额余额入口：明确记录未暴露，不发送组织/管理员管理API、不猜余额、不试任意中转站私有路径；供应商私有金额余额适配需先固定真实接口/认证契约。数值只在所有者/管理员报告中，不投影到公开市场/路由画像。",
      "detection/capability-projection": "Project只接受完整封存且目标/能力摘要/manifest/实现/参数/凭据范围匹配的真实报告，按独立断言与证明层级投影。partial/unknown/unobserved不能当支持；金额/地址/自然年龄不使证据失效。上下文只投影有精确实际计量步骤支撑的已验证下界，不用声明/参数接受/硬上界/指纹猜容量或身份。后台构建纯内存投影，热路径无新增I/O。",
      "codex-rl14-operational-assertions": "RL14 uses stable wire/semantic/identity-transport assertion labels. Scope remains unchanged; malformed and expansion-limit cases are controlled gateway regressions. Previous descriptions retained: [\"zstd 请求编码\", \"发真实压缩请求，核验正常转发、模型替换后的有效编码/长度及无压缩回归；非法编码/解压上限负例在受控网关测试验证。\", \"传输编码能力与 CLI 是否实际发压缩请求分别记录；不扩大上游故障诱发范围\"]",
      "codex-rl01-operational-scope": "Operational assertions retain this original scope: [\"Lite 协议标记 / 固定 CLI 的 Lite 路径\", \"核对实际 Header 名称、取值或其他协议识别方式，发真实请求并验证上游原生识别及平台保留。若该版本无独立 Lite Header，保留 ID 并按实际标记修正断言、记录源码/fixture 来源，不发明字段。\", \"与 CLI/provider/目录版本绑定；字段被接受不等于完整 Lite 支持\"]",
      "codex-rl02-operational-scope": "Operational assertions retain this original scope: [\"additional_tools 输入结构\", \"发固定版本的原生 input 声明并触发工具；核验工具名/参数/call 关联与结果回填。\", \"Lite 工具声明能力；不能由普通文本成功推导\"]",
      "codex-rl03-operational-scope": "Operational assertions retain this original scope: [\"顶层 tools 与 Lite 声明的原生支持\", \"分别用标准 tools 和 Lite 原生声明完成适用工具往返，各自保留原格式；上游只支持其一时分别报告。\", \"不进行声明互转；同次响应可支持多个子断言\"]",
      "codex-rl04-operational-scope": "Operational assertions retain this original scope: [\"parallel_tool_calls:false\", \"发送明确禁止并行的工具场景，按固定版本约束验证实际行为及 call/result；不由开关接受推导限制已执行。\", \"独立参数/行为证据；不增加并发压测\"]",
      "codex-rl05-operational-scope": "Operational assertions retain this original scope: [\"reasoning.context:all_turns\", \"使用有效的多轮合成上下文，分别记录参数接受和续聊行为，保留原生字段与 opaque 项。\", \"不从一次参数接受推导所有历史行为\"]",
      "codex-rl06-operational-scope": "Operational assertions retain this original scope: [\"developer / 基础指令语义\", \"固定版本适用的指令与合成内容，核验层级/内容保留及可验证结果。\", \"与实际模型/协议绑定，不改写为另一种指令协议\"]",
      "codex-rl07-operational-scope": "Operational assertions retain this original scope: [\"Namespace / custom 工具\", \"声明命名空间/工具，接收实际调用，按 namespace/name/call 标识回填并续聊，核验分片和关联。\", \"namespace/custom/普通 function 能力分别记录\"]",
      "codex-rl08-operational-scope": "Operational assertions retain this original scope: [\"Lite SSE 生命周期\", \"实际 Lite 文本/工具流核验事件、索引、UTF-8、增量和终态/usage；可选事件及自然错误按实际出现记录。\", \"HTTP 200 或可显示文本不能替代完整 SSE；不主动诱发上游错误\"]",
      "codex-rl09-operational-scope": "Operational assertions retain this original scope: [\"多轮加密推理原样续用\", \"生成后原样回传完整 encrypted reasoning 及相关项，验证后续推理；不因内部 ID 未登记拒绝。\", \"目标原生回放证据；跨渠道平台回归另见 RL23\"]",
      "codex-rl12-operational-scope": "Operational assertions retain this original scope: [\"标准与 Lite 原生兼容（保留旧“双向兼容”追溯）\", \"对标准/Lite 各自适用的请求→工具→回填→续聊留证；跨形态回放仅按固定契约实际验证，不凭成功猜测。\", \"上游兼容性分别报告；平台不做双向转换\"]",
      "codex-rl14-operational-scope": "Operational assertions retain this original scope: [\"content_encoding_zstd\", \"native_zstd_request\", \"uncompressed_request\"]",
      "codex-rl16-operational-scope": "Operational assertions retain this original scope: [\"独立 alpha/search\", \"按固定契约发搜索并核验实际结果结构/URL/opaque 输出及后续使用，记录可证实计量；CLI 证据须实际触发该 HTTP 路径。\", \"与 Responses 内置 web_search 分开；不代理任意返回 URL\"]",
      "codex-rl20-operational-scope": "Operational assertions retain this original scope: [\"V1 standalone compact\", \"用固定原生 compact 路径提交完整输入，保留返回的整个有效窗口及顺序并续聊；可复用 F4/F7 同目标/同路径/同配置真实证据。\", \"原生 V1 能力；不能代替 V2 或后台执行\"]",
      "codex-rl21-operational-scope": "Operational assertions retain this original scope: [\"V2 compaction_trigger\", \"普通 Responses 输入实际 trigger，收集 compaction 输出后完整回传续聊，核验固定版本实际状态/元数据。\", \"原生 V2 能力；store:false 与内部 ID 不引入来源绑定；不宣称所有摘要语义精确保留\"]",
      "codex-rl22-operational-scope": "Operational assertions retain this original scope: [\"客户端后台 V2 正确性\", \"用确实生效的独立配置触发后台 V2，与前台请求存在实际重叠，核验结果使用/取消/关闭及无重复收费。\", \"同一 V2 的执行方式；不是 background=true、新接口或性能压测\"]",
      "codex-rl24-operational-scope": "Operational assertions retain this original scope: [\"实际服务档位\", \"每个启用档位用有意义请求核验请求值、实际返回档位和可靠计量；UI/参数宣称与实际返档分别记录。\", \"降到 default 不记成 ultrafast/priority 实际通过，不由标记宣称性能提升；报价/计费接 F6\"]",
      "codex-rl13-operational-scope": "Operational assertions retain this original scope: [\"客户端接入前置\", \"固定认证/provider/base URL/目录/开关，隔离启动官方 CLI，验证实际模式与工具/请求是否启用；不得读取宿主登录。\", \"三层证据；客户端未启用、配置错、平台未实现不是上游 unsupported\"]",
      "codex-rl15-operational-scope": "Operational assertions retain this original scope: [\"Codex 能力目录\", \"固定版本请求目录，按账号/Key、模型别名/治理和候选能力过滤；由 CLI 实际读取，核验工具、模态、上下文和服务档位元数据与有效证据一致。\", \"不暴露共享账号目录或存完整提示词；目录声明不自动证明能力\"]",
      "codex-rl17-operational-scope": "Operational assertions retain this original scope: [\"notes thread_hint\", \"新会话/有权会话分别调用固定 thread_hint，核验空/非空结构与客户端使用；无 model 依既定候选规则。\", \"会话上下文辅助；不登记来源渠道粘性，不存提示正文\"]",
      "codex-rl18-operational-scope": "Operational assertions retain this original scope: [\"notes 写读/列表及固定范围内操作\", \"固定客户端实际注册的范围内操作逐项登记子断言；以 thread_hint→write_file→read_file→list_files_by_prefix 及退出恢复为已观测起点。append/search 等源码操作如属本轮固定清单须单独命名/留证，不能由写读通过推导。密文只原样往返并用合成标记核验。\", \"F0 冻结有限操作/方法/路径/必需头清单；文件名接口仍限会话笔记，不恢复 Files；不存正文\"]",
      "codex-rl19-operational-scope": "Operational assertions retain this original scope: [\"history 窗口/条目及固定范围内操作\", \"list_windows→list_items→read_item 验证真实远端历史和恢复、筛选/分页/父子关系；固定清单的 search 等操作独立取证，不能只由本地重放宣布远端历史通过。\", \"F0 冻结有限操作清单；归属只校验账号/Key，不锁定原渠道/凭据\"]",
      "codex-rl23-operational-scope": "Operational assertions retain this original scope: [\"自包含状态/history-notes 跨渠道\", \"明确受控 A 产生/B 续用、A 写/B 读和排序变化；覆盖同组不同凭据及跨组，标准资源引用负例仍受限。\", \"平台机制/真实上游兼容性分列；无任意供应商两两创建前置，不因失败恢复粘性\"]",
      "codex-rl26-operational-scope": "Operational assertions retain this original scope: [\"专项权限与隔离\", \"两账号/两 Key 共用上游凭据，验证 session/agent/path/window/item 冲突、猜测/未知引用、列表、凭据轮换及 Key 撤销；验证实际入口认证/固定出站和脱敏。\", \"归属元数据不变成来源粘性；未知/冲突不能读取共享账号他人内容；不复制正文补兼容\"]",
      "codex-rl25-operational-scope": "Operational assertions retain this original scope: [\"Codex 专用原生生图\", \"固定 CLI 实际调用已研究 images/generations 路径，检查图像模型权限/候选、请求/产物/可靠计量与后续工具使用；上游不支持记录真实负向结果。\", \"F8 负责专用入口，复用 F7/F6；不能以通用生图或主对话权限/报价代证，不恢复文件资源\", \"固定CLI原生JSON edits使用images[].image_url（inline/合法URL），与通用multipart edits分别验证；未知file_id不因资源接口移出获得共享凭据权限。\"]",
      "codex-proof-layer-assertions": "RL13 and RL15 assign platform/CLI assertions to their actual proof layer. All three layers remain mandatory. IDs keep their original positions; source mappings, RL10 aggregation, RL11 exclusion and endpoint scope remain intact. Notes/history context isolation remains a hard privacy requirement.",
      "codex-rl14-endpoint-evidence": "RL14 separately tests the native Codex and public Responses entrances; neither endpoint supplies transport capability evidence for the other. Public assertions are upstream/gateway only; the pinned CLI compression profile uses its actual native endpoint.",
      "codex-notes-model-prerequisites": "RL18 uses the actual native catalog for an explicit group model prerequisite and actual native model-produced encrypted arguments/output consumption. No invented ciphertext, notes body persistence, resource management API, timed consistency wait or source-channel binding.",
      "codex-history-seed-scope": "RL19 seeds only a synthetic session and known window using pinned CLI history_ingest_requested metadata. It reads only item IDs recovered from that window and matching the unpredictable seeded content, performs immediate observations without waiting, and records missing IDs as failed prerequisites rather than guessing resources or binding source channels."
    }
  }
