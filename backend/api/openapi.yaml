    GatewayCapacitySearch:
      type: object
      description: F0 目标参数契约，尚无后台入口；上下文和最大输出分别配置。low < high <= hard_maximum，precision 必须有限且为正，relative 模式不得大于 1。任务开始固定全部参数及版本，不跟随在途修改；不是全测累计预算。
      additionalProperties: false
      required: [version, method, low, high, hard_maximum, precision_mode, precision, rounds, rechecks]
      properties:
        version: {type: string, minLength: 1, readOnly: true}
        method: {type: string, enum: [binary, ternary], default: binary}
        low: {type: integer, format: int64, minimum: 0}
        high: {type: integer, format: int64, minimum: 1}
        hard_maximum: {type: integer, format: int64, minimum: 1}
        precision_mode: {type: string, enum: [absolute, relative]}
        precision: {type: number, exclusiveMinimum: 0}
        rounds: {type: integer, minimum: 1}
        rechecks: {type: integer, minimum: 0}
