            schema: {type: object, description: "协议原生请求正文。"}
      responses:
        default: {description: "协议原生响应（含流式）与协议原生错误。"}
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: oma_session
      description: "登录后由服务端设置的 HttpOnly 会话 Cookie。"
    bearerKey: {type: http, scheme: bearer, description: "平台 API Key：Authorization: Bearer <key>（OpenAI 协议）。"}
    anthropicKey:
      type: apiKey
      in: header
      name: x-api-key
      description: "平台 API Key（Anthropic 协议）。"
    geminiKey:
      type: apiKey
      in: header
      name: x-goog-api-key
      description: "平台 API Key（Gemini 协议）。"
  parameters:
    accountID:
      name: accountID
      in: path
      required: true
      description: "账户 ID（UUID）。"
      schema: {type: string, format: uuid}
    modelID:
      name: modelID
      in: path
      required: true
      description: "规范模型 ID；ID 可含 `/`，原样放入路径。"
      schema: {type: string}
    channelID:
      name: channelID
      in: path
      required: true
      description: "渠道 ID。"
      schema: {type: string}
    offerID:
      name: offerID
      in: path
      required: true
      description: "报价 ID。"
      schema: {type: string}
    keyID:
      name: keyID
      in: path
      required: true
      description: "API Key ID。"
      schema: {type: string}
    callID:
      name: callID
      in: path
      required: true
      description: "调用 ID。"
      schema: {type: string}
    orderID:
      name: orderID
      in: path
      required: true
      description: "C2C 订单 ID。"
      schema: {type: string}
    tradeID:
      name: tradeID
      in: path
      required: true
      description: "C2C 交易 ID。"
      schema: {type: string}
    methodID:
      name: methodID
      in: path
      required: true
      description: "收款方式 ID。"
      schema: {type: string}
    systemKind:
      name: systemKind
      in: path
      required: true
      description: "系统账户类型。"
      schema: {type: string, enum: [platform_incentive, platform_loss]}
    Idempotency-Key:
      name: Idempotency-Key
      in: header
      required: false
      description: "幂等键；相同键重复提交返回同一结果。"
      schema: {type: string}
    model:
      name: model
      in: path
      required: true
      description: "规范模型 ID 与动作，例如 `canonical/model:generateContent`。"
      schema: {type: string}
  responses:
    BadRequest:
      description: "请求格式无效或查询参数非法（invalid_json、invalid_request、invalid_input）。"
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    Unauthorized:
      description: "未登录或会话失效（authentication_required）。"
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    Forbidden:
      description: "被拒绝：跨站请求（cross_origin_request）、首次登录须改密（password_change_required）、需要管理员（administrator_required）或无权操作（forbidden）。"
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    NotFound:
      description: "资源不存在（not_found）。"
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    Conflict:
      description: "版本或状态冲突（conflict、ledger_conflict、c2c_conflict、fee_rate_conflict 等）。"
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    Unprocessable:
      description: "业务校验失败（invalid_input、insufficient_spendable_capacity、unsafe_upstream 等）。"
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    TooManyRequests:
      description: "触发限流或服务繁忙（login_rate_limited、password_rate_limited、*_busy）。"
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    Unavailable:
      description: "服务暂不可用（database_unavailable、gateway_unavailable）。"
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
  schemas:
    Amount: {type: string, pattern: "^-?[0-9]+(\\.[0-9]{1,9})?$", description: "积分金额的十进制字符串，最多 9 位小数，不使用浮点数。"}
    Timestamp: {type: string, format: date-time, description: "RFC 3339 时间。"}
    PriceString: {type: string, pattern: "^(0|[1-9][0-9]{0,5})(\\.[0-9]{1,9})?$", description: "模型单价（积分/百万 Token）的十进制字符串。"}
    Error:
      type: object
      properties:
        code: {type: string}
        message: {type: string}
      required: [code, message]
      additionalProperties: false
    ErrorResponse:
      type: object
      description: "所有 /api 错误的统一信封；code 为稳定的机器可读标识，message 为中文提示。"
      properties:
        error: {$ref: "#/components/schemas/Error"}
      required: [error]
      additionalProperties: false
    Health:
      type: object
      properties:
        service: {type: string, const: oh-my-aihub-backend}
        status: {type: string, const: ok}
      required: [service, status]
      additionalProperties: false
    InstanceState:
      type: object
      properties:
        initialized: {type: boolean}
      required: [initialized]
      additionalProperties: false
    InstanceInitializeRequest:
      type: object
      properties:
        username: {type: string}
        display_name: {type: string}
        password: {type: string}
      required: [username, display_name, password]
      additionalProperties: false
    InstanceInitializeResponse:
      type: object
      properties:
        initialized: {type: boolean, const: true}
        account: {$ref: "#/components/schemas/Account"}
      required: [initialized, account]
      additionalProperties: false
    Account:
      type: object
      properties:
        id: {type: string}
        username: {type: string}
        display_name: {type: string}
        is_admin: {type: boolean}
        status: {type: string, enum: [active, disabled]}
        must_change_password: {type: boolean}
        version: {type: integer}
        credit_limit: {$ref: "#/components/schemas/Amount"}
        credit_frozen: {type: boolean}
        posted_balance: {$ref: "#/components/schemas/Amount"}
        asset_reserved: {$ref: "#/components/schemas/Amount"}
        spend_authorized: {$ref: "#/components/schemas/Amount"}
        effective_credit_limit: {$ref: "#/components/schemas/Amount"}
        credit_used: {$ref: "#/components/schemas/Amount"}
        spendable_capacity: {$ref: "#/components/schemas/Amount"}
        over_limit: {type: boolean}
        created_at: {$ref: "#/components/schemas/Timestamp"}
        updated_at: {$ref: "#/components/schemas/Timestamp"}
        password_changed_at:
          anyOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
      required: [id, username, display_name, is_admin, status, must_change_password, version, credit_limit, credit_frozen, posted_balance, asset_reserved, spend_authorized, effective_credit_limit, credit_used, spendable_capacity, over_limit, created_at, updated_at, password_changed_at]
      additionalProperties: false
    AccountEnvelope:
      type: object
      properties:
        account: {$ref: "#/components/schemas/Account"}
      required: [account]
      additionalProperties: false
    AccountList:
      type: object
      properties:
        accounts:
          type: array
          items: {$ref: "#/components/schemas/Account"}
      required: [accounts]
      additionalProperties: false
    LoginRequest:
      type: object
      properties:
        username: {type: string, maxLength: 128}
        password: {type: string, maxLength: 128}
      required: [username, password]
      additionalProperties: false
    ChangePasswordRequest:
      type: object
      properties:
        current_password: {type: string, maxLength: 128}
        new_password: {type: string, maxLength: 128}
      required: [current_password, new_password]
      additionalProperties: false
    CreateAccountRequest:
      type: object
      properties:
        username: {type: string}
        display_name: {type: string}
        credit_limit: {$ref: "#/components/schemas/Amount"}
        is_admin: {type: boolean}
        status: {type: string, enum: [active, disabled]}
      required: [username, display_name, credit_limit]
      additionalProperties: false
    AccountWithInitialPassword:
      type: object
      description: "initial_password 仅在创建或重置时返回一次。"
      properties:
        account: {$ref: "#/components/schemas/Account"}
        initial_password: {type: string}
      required: [account, initial_password]
      additionalProperties: false
    UpdateAccountRequest:
      type: object
      properties:
        expected_version: {type: integer}
        status: {type: string, enum: [active, disabled]}
        credit_limit: {$ref: "#/components/schemas/Amount"}
        credit_frozen: {type: boolean}
        is_admin: {type: boolean}
      required: [expected_version]
      additionalProperties: false
    EmptyRequest:
      type: object
      properties: {}
      required: []
      additionalProperties: false
    PriceTier:
      type: object
      properties:
        name: {type: string}
        timezone: {type: string}
        min_prompt_tokens: {type: [integer, "null"]}
        max_prompt_tokens: {type: [integer, "null"]}
        weekdays:
          type: [array, "null"]
          items: {type: integer}
        start_minute_of_day: {type: [integer, "null"]}
        end_minute_of_day: {type: [integer, "null"]}
        input_price: {$ref: "#/components/schemas/Amount"}
        output_price: {$ref: "#/components/schemas/Amount"}
        cache_write_price: {$ref: "#/components/schemas/Amount"}
        cache_read_price: {$ref: "#/components/schemas/Amount"}
        price_unit: {type: string, const: points_per_million_tokens}
      required: [name, timezone, min_prompt_tokens, max_prompt_tokens, weekdays, start_minute_of_day, end_minute_of_day, input_price, output_price, cache_write_price, cache_read_price, price_unit]
      additionalProperties: false
    PriceTierRequest:
      type: object
      properties:
        name: {type: string}
        min_prompt_tokens: {type: [integer, "null"]}
        max_prompt_tokens: {type: [integer, "null"]}
        timezone: {type: string}
        weekdays:
          type: [array, "null"]
          items: {type: integer}
        start_minute_of_day: {type: [integer, "null"]}
        end_minute_of_day: {type: [integer, "null"]}
        input_price: {$ref: "#/components/schemas/PriceString"}
        output_price: {$ref: "#/components/schemas/PriceString"}
        cache_write_price: {$ref: "#/components/schemas/PriceString"}
        cache_read_price: {$ref: "#/components/schemas/PriceString"}
      required: [name, input_price, output_price, cache_write_price, cache_read_price]
      additionalProperties: false
    Model:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        provider: {type: string}
        context_window: {type: integer}
        parameter_info: {type: string}
        input_modalities:
          type: array
          items: {type: string}
        output_modalities:
          type: array
          items: {type: string}
        supports_tools: {type: boolean}
        supports_structured_output: {type: boolean}
        supports_vision: {type: boolean}
        input_price: {$ref: "#/components/schemas/Amount"}
        output_price: {$ref: "#/components/schemas/Amount"}
        cache_write_price: {$ref: "#/components/schemas/Amount"}
        cache_read_price: {$ref: "#/components/schemas/Amount"}
        price_tiers:
          type: array
          items: {$ref: "#/components/schemas/PriceTier"}
        price_unit: {type: string, const: points_per_million_tokens}
        status: {type: string, enum: [active, disabled]}
        version: {type: integer}
        created_at: {$ref: "#/components/schemas/Timestamp"}
        updated_at: {$ref: "#/components/schemas/Timestamp"}
        price_updated_at: {$ref: "#/components/schemas/Timestamp"}
      required: [id, name, provider, context_window, parameter_info, input_modalities, output_modalities, supports_tools, supports_structured_output, supports_vision, input_price, output_price, cache_write_price, cache_read_price, price_tiers, price_unit, status, version, created_at, updated_at, price_updated_at]
      additionalProperties: false
    ModelEnvelope:
      type: object
      properties:
        model: {$ref: "#/components/schemas/Model"}
      required: [model]
      additionalProperties: false
    ModelList:
      type: object
      properties:
        models:
          type: array
          items: {$ref: "#/components/schemas/Model"}
      required: [models]
      additionalProperties: false
    ModelRequest:
      type: object
      properties:
        id: {type: string, description: "创建时必填；更新时以路径为准。"}
        name: {type: string}
        provider: {type: string}
        context_window: {type: integer}
        parameter_info: {type: string}
        input_modalities:
          type: array
          items: {type: string}
        output_modalities:
          type: array
          items: {type: string}
        supports_tools: {type: boolean}
        supports_structured_output: {type: boolean}
        supports_vision: {type: boolean}
        input_price: {$ref: "#/components/schemas/PriceString"}
        output_price: {$ref: "#/components/schemas/PriceString"}
        cache_write_price: {$ref: "#/components/schemas/PriceString"}
        cache_read_price: {$ref: "#/components/schemas/PriceString"}
        price_tiers:
          type: array
          items: {$ref: "#/components/schemas/PriceTierRequest"}
        status: {type: string, enum: [active, disabled]}
        expected_version: {type: integer, description: "仅更新时使用。"}
      required: [name, provider, input_price, output_price, cache_write_price, cache_read_price, status]
      additionalProperties: false
    Wallet:
      type: object
      properties:
        posted_balance: {$ref: "#/components/schemas/Amount"}
        asset_reserved: {$ref: "#/components/schemas/Amount"}
        spend_authorized: {$ref: "#/components/schemas/Amount"}
        credit_limit: {$ref: "#/components/schemas/Amount"}
        effective_credit_limit: {$ref: "#/components/schemas/Amount"}
        credit_used: {$ref: "#/components/schemas/Amount"}
        credit_frozen: {type: boolean}
        spendable_capacity: {$ref: "#/components/schemas/Amount"}
        over_limit: {type: boolean}
        risk_status: {type: string, enum: [credit_frozen, over_limit, insufficient, normal]}
        updated_at: {$ref: "#/components/schemas/Timestamp"}
      required: [posted_balance, asset_reserved, spend_authorized, credit_limit, effective_credit_limit, credit_used, credit_frozen, spendable_capacity, over_limit, risk_status, updated_at]
      additionalProperties: false
    WalletEnvelope:
      type: object
      properties:
        wallet: {$ref: "#/components/schemas/Wallet"}
