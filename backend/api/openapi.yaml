      - {$ref: '#/components/parameters/secondDimensionQuery'}
      - {$ref: '#/components/parameters/secondValueQuery'}
      - {$ref: '#/components/parameters/streamQuery'}
      - {$ref: '#/components/parameters/minAttempts'}
      - {$ref: '#/components/parameters/maxAttempts'}
      - {$ref: '#/components/parameters/statusCodeQuery'}
      - {$ref: '#/components/parameters/errorCodeQuery'}
      - {$ref: '#/components/parameters/endReasonQuery'}
      - {$ref: '#/components/parameters/deliveryQuery'}
      - {$ref: '#/components/parameters/usageStatusQuery'}
      - {$ref: '#/components/parameters/billedQuery'}
      - {$ref: '#/components/parameters/attemptChannelQuery'}
      - {$ref: '#/components/parameters/requestID'}
      - {$ref: '#/components/parameters/minDurationMs'}
      - {$ref: '#/components/parameters/maxDurationMs'}
      - {$ref: '#/components/parameters/minTokens'}
      - {$ref: '#/components/parameters/maxTokens'}
      - {$ref: '#/components/parameters/minCost'}
      - {$ref: '#/components/parameters/maxCost'}
      - {$ref: '#/components/parameters/modelQuery'}
      - {$ref: '#/components/parameters/outcome'}
      - {$ref: '#/components/parameters/apiKeyIDQuery'}
      - {$ref: '#/components/parameters/tag'}
      - {$ref: '#/components/parameters/format'}
      - {$ref: '#/components/parameters/accountIDQuery'}
      - {$ref: '#/components/parameters/channelIDQuery'}
      - {$ref: '#/components/parameters/from'}
      - {$ref: '#/components/parameters/to'}
      - in: query
        name: group_by
        schema: {type: string, enum: [all, model, channel, format, stream, key, tag, account, outcome, error, error_code, status, stop, service_tier]}
      - in: query
        name: split_by
        schema: {type: string, enum: [all, model, channel, format, stream, key, tag, account, outcome, error, error_code, status, stop, service_tier]}
      - in: query
        name: bucket_seconds
        schema: {type: integer}
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AnalysisReport'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503':
          description: 分析超过资源预算，请缩小时间范围或增加筛选
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}

