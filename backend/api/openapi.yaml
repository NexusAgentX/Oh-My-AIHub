    post:
      operationId: proxyOpenAIChat
      tags: [gateway]
      summary: OpenAI Chat Completions
      description: "外部模型 API 入口：请求与响应按原生格式透传（只换鉴权、可选换 User-Agent 与请求头、替换顶层 model），本规范不描述正文，也不生成前端类型。不走会话 Cookie，也不做同源校验。\n\n无状态边界：顶层 store 为真（含大小写变体、重复键与非布尔真值）时整组剥离，其余字节不动；previous_response_id 或 conversation 在转发前返回 400 stateful_request_unsupported，文案点名被拒字段。网关不保存续接状态，客户端必须自带完整上下文。"
      x-access: gateway_key
      x-feature: B
      security:
      - {bearerKey: []}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, description: 原生请求正文。}
      responses:
        default: {description: 原生响应（含流式）与原生错误。}
  /v1/responses:
    post:
      operationId: proxyOpenAIResponses
      tags: [gateway]
      summary: OpenAI Responses
